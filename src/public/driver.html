<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="YB Driver" />
<link rel="manifest" href="/driver-manifest.json" />
<link rel="icon" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />
<title>YB Driver</title>
<style>
  :root { --bg:#f4f3ef; --card:#fff; --ink:#151515; --muted:#6b6862; --line:#dedad2; --orange:#e8710a; --orange-d:#c25d05;
          --good:#1f7a3f; --good-bg:#e5f3ea; --warn:#8a5a00; --warn-bg:#fff3d6; --bad:#b3261e; --bad-bg:#fde7e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --card:#1d1d1d; --ink:#f2f2f2; --muted:#a19d96; --line:#33312d;
          --good-bg:#14301f; --warn-bg:#332507; --bad-bg:#3a1513; --good:#6fd394; --warn:#f2c260; --bad:#ff8a80; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px); }
  header { position: sticky; top: 0; z-index: 5; background:#111; color:#fff; padding: 10px 16px; display:flex; align-items:center; gap:10px; }
  .logo { font-weight: 900; letter-spacing: .5px; font-size: 18px; } .logo b { color: var(--orange); }
  header .who { margin-left:auto; text-align:right; font-size: 13px; line-height:1.2; opacity:.9; }
  header .who a { color: #ffb36b; text-decoration: none; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 4px 0 12px; } h2 { font-size: 15px; text-transform: uppercase; letter-spacing:.6px; color: var(--muted); margin: 0 0 10px; }
  label { display:block; font-weight: 700; font-size: 15px; margin: 14px 0 6px; } label:first-child { margin-top: 0; }
  label small { font-weight: 400; color: var(--muted); }
  input, select, textarea { width:100%; font-size: 19px; padding: 14px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); }
  input.big { font-size: 26px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .row { display:flex; gap: 10px; } .row > * { flex: 1; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  .btn { width:100%; padding: 18px; font-size: 20px; font-weight: 800; background: var(--orange); color:#fff; }
  .btn:active { background: var(--orange-d); } .btn[disabled] { opacity:.5; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); font-weight: 700; font-size: 17px; padding: 14px; }
  .actions { display:grid; grid-template-columns: 1fr; gap: 12px; }
  .act { text-align:left; padding: 18px 18px; background: var(--card); border: 2px solid var(--line); color: var(--ink); display:flex; align-items:center; gap: 14px; }
  .act:active { border-color: var(--orange); }
  .act .ic { width: 52px; height: 52px; border-radius: 12px; background: var(--orange); color:#fff; display:grid; place-items:center; font-size: 26px; font-weight: 900; flex: none; }
  .act b { font-size: 22px; display:block; } .act span { color: var(--muted); font-size: 15px; }
  .act.small .ic { background: #555; width: 40px; height: 40px; font-size: 20px; } .act.small b { font-size: 17px; }
  .hint { margin-top: 8px; padding: 10px 12px; border-radius: 10px; font-size: 15px; }
  .hint.ok { background: var(--good-bg); color: var(--good); } .hint.warn { background: var(--warn-bg); color: var(--warn); } .hint.bad { background: var(--bad-bg); color: var(--bad); }
  .chips { display:flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { padding: 10px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 16px; }
  .chip.on { border-color: var(--orange); background: var(--orange); color:#fff; }
  .sugg { border: 2px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; margin-top: -6px; overflow: hidden; }
  .sugg div { padding: 12px 14px; border-top: 1px solid var(--line); background: var(--card); } .sugg div small { color: var(--muted); display:block; }
  .muted { color: var(--muted); font-size: 14px; }
  .list .item { padding: 12px 0; border-top: 1px solid var(--line); } .list .item:first-child { border-top: 0; }
  .item .t { font-weight: 800; } .item .s { color: var(--muted); font-size: 14px; }
  .tag { display:inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); margin-left: 6px; vertical-align: middle; }
  .tag.q { background: var(--bad-bg); color: var(--bad); }
  .done { text-align:center; padding: 26px 16px; } .done .big { font-size: 64px; line-height: 1; color: var(--good); }
  .photo-prev { margin-top: 8px; max-width: 100%; border-radius: 10px; display:block; }
  .back { background:none; color: var(--muted); font-size: 16px; padding: 4px 0; margin-bottom: 6px; }
  .err { color: var(--bad); font-weight: 700; margin-top: 10px; }
  .banner { background: var(--warn-bg); color: var(--warn); padding: 10px 16px; font-weight: 700; font-size: 15px; text-align:center; }
</style>
</head>
<body>
<header><div class="logo">Y<b>B</b> &nbsp;DRIVER</div><div class="who" id="who"></div></header>
<div id="banner"></div>
<main id="app"></main>

<script>
/* YB Driver — box drops / pick-ups / swaps from the cab. Posts to the Yard-Built API on this same
   server. Works with bad signal: anything that can't send is kept on the phone and retried. */
const API = location.origin;
const YARDS = [["SB", "Scottsbluff"], ["HAYS", "Hays"], ["COLBY", "Colby"], ["RC", "Rapid City"]];
const LS = { get: (k, d) => { try { const v = localStorage.getItem("ybd_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
             set: (k, v) => { try { localStorage.setItem("ybd_" + k, JSON.stringify(v)); } catch {} } };
let token = LS.get("token", null), me = LS.get("me", null);
let boxes = LS.get("boxes", []), screen = "home", form = {}, lastResult = null, recent = [], gps = null, busy = false, errMsg = "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const boxKey = (s) => (String(s || "").toUpperCase().match(/[A-Z]+|\d+/g) || []).map((t) => (/^\d+$/.test(t) ? String(parseInt(t, 10)) : t)).join("-");
const yardName = (c) => (YARDS.find((y) => y[0] === c) || [c, c])[1];

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) } });
  let body = null; try { body = await res.json(); } catch {}
  if (res.status === 401 && path !== "/auth/login") { token = null; LS.set("token", null); render(); throw Object.assign(new Error("Please sign in again"), { auth: true }); }
  if (!res.ok) throw Object.assign(new Error((body && body.error) || "Request failed (" + res.status + ")"), { status: res.status });
  return body;
}

/* ---------- offline queue ---------- */
const queue = () => LS.get("queue", []);
async function flushQueue() {
  if (!token) return;
  let q = queue(), changed = false;
  for (const item of [...q]) {
    try {
      const r = await api("/boxes/moves", { method: "POST", body: JSON.stringify(item) });
      q = q.filter((x) => x.clientId !== item.clientId); changed = true;
      if (r.warnings && r.warnings.length) LS.set("lastQueuedWarnings", r.warnings);
    } catch (e) {
      if (e.auth || !e.status) break;            // signed out or still no signal: try again later
      item.failed = e.message; changed = true;     // the server refused it: keep it visible so it can be fixed
    }
  }
  if (changed) { LS.set("queue", q); refreshData(); }
  renderBanner();
}
setInterval(flushQueue, 30000);
window.addEventListener("online", flushQueue);

async function refreshData() {
  if (!token) return;
  try { boxes = await api("/boxes"); LS.set("boxes", boxes.map(({ sd_snapshot, ...b }) => b)); } catch {}
  try { const since = new Date(); since.setHours(0, 0, 0, 0); recent = await api("/boxes/moves?mine=1&limit=30&since=" + since.toISOString()); } catch {}
  if (screen === "home") render();
}

function grabGps() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((p) => { gps = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), accuracy: p.coords.accuracy }; renderGps(); },
    () => { gps = null; renderGps(); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}

/* ---------- screens ---------- */
function renderBanner() {
  const q = queue(), failed = q.filter((x) => x.failed);
  $("#banner").innerHTML = q.length
    ? `<div class="banner">${q.length} entr${q.length === 1 ? "y" : "ies"} saved on this phone, waiting for signal${failed.length ? ` · ${failed.length} need fixing (see below)` : ""}</div>` : "";
}
function render() {
  renderBanner();
  $("#who").innerHTML = token && me ? `${esc(me.name)}<br><a href="#" onclick="signOut();return false;">Sign out</a>` : "";
  if (!token) return renderLogin();
  if (me && me.mustChangePassword) return renderChangePw();
  ({ home: renderHome, form: renderForm, done: renderDone })[screen]();
}

function renderLogin() {
  $("#app").innerHTML = `<div class="card"><h1>Sign in</h1>
    <label>Email</label><input id="em" type="email" autocomplete="username" inputmode="email" value="${esc(LS.get("email", ""))}" />
    <label>Password</label><input id="pw" type="password" autocomplete="current-password" />
    <div class="err" id="err">${esc(errMsg)}</div>
    <div style="height:14px"></div><button class="btn" onclick="signIn()">Sign in</button>
    <p class="muted" style="margin-top:14px;">Your login comes from the office. Tip: tap Share → <b>Add to Home Screen</b> so this opens like an app.</p></div>`;
}
async function signIn() {
  const email = $("#em").value.trim(), password = $("#pw").value;
  errMsg = "";
  try {
    const r = await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    token = r.token; me = r.user; LS.set("token", token); LS.set("me", me); LS.set("email", email);
    if (!LS.get("yard", null)) LS.set("yard", me.homeYard || "SB");
    screen = "home"; render(); refreshData(); flushQueue();
  } catch (e) { errMsg = e.message; renderLogin(); }
}
function signOut() { if (queue().length && !confirm("There are entries still waiting to send. Sign out anyway? They stay on this phone.")) return; token = null; LS.set("token", null); render(); }

function renderChangePw() {
  $("#app").innerHTML = `<div class="card"><h1>Set your password</h1><p class="muted">First time in — pick a new password (8+ characters).</p>
    <label>Temporary password</label><input id="cp" type="password" />
    <label>New password</label><input id="np" type="password" autocomplete="new-password" />
    <div class="err" id="err"></div><div style="height:14px"></div><button class="btn" onclick="changePw()">Save</button></div>`;
}
async function changePw() {
  try { await api("/auth/change-password", { method: "POST", body: JSON.stringify({ currentPassword: $("#cp").value, newPassword: $("#np").value }) });
        me.mustChangePassword = false; LS.set("me", me); render(); }
  catch (e) { $("#err").textContent = e.message; }
}

function renderHome() {
  const yard = LS.get("yard", "SB"), truck = LS.get("truck", "");
  const q = queue();
  $("#app").innerHTML = `
    <div class="card">
      <div class="row">
        <div><label>Yard</label><select id="yard" onchange="LS.set('yard', this.value)">${YARDS.map(([c, n]) => `<option value="${c}" ${c === yard ? "selected" : ""}>${n}</option>`).join("")}</select></div>
        <div><label>Truck #</label><input id="truck" value="${esc(truck)}" inputmode="numeric" placeholder="e.g. 206" onchange="LS.set('truck', this.value.trim())" /></div>
      </div>
    </div>
    <div class="actions">
      <button class="act" onclick="start('swap')"><div class="ic">⇄</div><div><b>Swap</b><span>Drop an empty, pick up the full one</span></div></button>
      <button class="act" onclick="start('drop')"><div class="ic">↓</div><div><b>Drop off</b><span>Leave a box at a customer</span></div></button>
      <button class="act" onclick="start('pickup')"><div class="ic">↑</div><div><b>Pick up</b><span>Bring a box back to the yard</span></div></button>
      <button class="act small" onclick="start('yard_move')"><div class="ic">⌂</div><div><b>Box is at the yard</b><span>Moved between yards / found it here</span></div></button>
      <button class="act small" onclick="start('status')"><div class="ic">!</div><div><b>Damaged or missing box</b><span>Tell the office</span></div></button>
    </div>
    ${q.length ? `<div class="card" style="margin-top:14px;"><h2>Waiting to send</h2><div class="list">${q.map((x) => `<div class="item"><div class="t">${actLabel(x.action)} · ${esc([x.boxIn, x.boxOut].filter(Boolean).join(" ⇄ "))} ${x.failed ? '<span class="tag q">Needs fixing</span>' : ""}</div>
      <div class="s">${esc(x.customerName || yardName(x.yard))} · ${new Date(x.occurredAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}${x.failed ? " — " + esc(x.failed) : ""}</div>
      ${x.failed ? `<button class="chip" style="margin-top:6px" onclick="dropQueued('${x.clientId}')">Delete this entry</button>` : ""}</div>`).join("")}</div>
      <div style="height:10px"></div><button class="btn ghost" onclick="flushQueue()">Try sending now</button></div>` : ""}
    <div class="card" style="margin-top:14px;"><h2>Today</h2><div class="list">${recent.length ? recent.map((m) => `<div class="item">
      <div class="t">${actLabel(m.action)} · ${esc([m.box_in || m.box_in_number, m.box_out || m.box_out_number].filter(Boolean).join(" ⇄ "))}${m.voided_at ? '<span class="tag q">Voided by office</span>' : (m.warnings && m.warnings.length ? '<span class="tag">Office will check</span>' : "")}</div>
      <div class="s">${esc(m.customer_name || yardName(m.yard))} · ${new Date(m.occurred_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div></div>`).join("") : `<div class="muted">Nothing yet today.</div>`}</div></div>`;
}
const actLabel = (a) => ({ swap: "Swap", drop: "Drop", pickup: "Pick up", yard_move: "At yard", status: "Reported", correction: "Correction" }[a] || a);
function dropQueued(id) { if (!confirm("Delete this entry from the phone? Tell the office what happened instead.")) return; LS.set("queue", queue().filter((x) => x.clientId !== id)); render(); }

function start(action) {
  const truck = $("#truck") ? $("#truck").value.trim() : LS.get("truck", "");
  LS.set("truck", truck); LS.set("yard", $("#yard") ? $("#yard").value : LS.get("yard", "SB"));
  form = { action, customerName: "", site: "", vendorId: null, boxIn: "", boxOut: "", newStatus: "repair", notes: "", photo: null };
  errMsg = ""; screen = "form"; gps = null; grabGps(); render(); window.scrollTo(0, 0);
}

function boxHint(typed, role) {
  if (!typed.trim()) return "";
  const k = boxKey(typed), hit = boxes.find((b) => boxKey(b.number) === k);
  if (!hit) return `<div class="hint warn">Box <b>${esc(typed.toUpperCase())}</b> isn't on the list. Double-check the number — if it's right, send it and the office will add it.</div>`;
  const desc = `${esc(hit.number)} · ${esc([hit.size, hit.kind].filter(Boolean).join(" "))}`;
  const at = hit.status === "customer" ? `at <b>${esc(hit.customer_name || "a customer")}</b>` : hit.status === "yard" ? `at the <b>${esc(yardName(hit.current_yard || hit.home_yard))}</b> yard` : `marked <b>${esc(hit.status)}</b>`;
  const cust = form.customerName.trim().toLowerCase();
  if (role === "out" && (hit.status !== "customer" || (cust && (hit.customer_name || "").toLowerCase() !== cust)))
    return `<div class="hint warn">✓ ${desc} — but it shows ${at}. Send it anyway; the office will check.</div>`;
  if (role === "in" && hit.status === "customer" && cust && (hit.customer_name || "").toLowerCase() !== cust)
    return `<div class="hint warn">✓ ${desc} — but it shows ${at}. Send it anyway; the office will check.</div>`;
  return `<div class="hint ok">✓ ${desc} — shows ${at}</div>`;
}
function boxesAtCustomer() {
  const c = form.customerName.trim().toLowerCase();
  if (!c) return [];
  return boxes.filter((b) => b.status === "customer" && (b.customer_name || "").toLowerCase() === c);
}

function renderForm() {
  const a = form.action;
  const needCust = ["swap", "drop", "pickup"].includes(a), needIn = ["swap", "drop", "yard_move", "status"].includes(a), needOut = ["swap", "pickup"].includes(a);
  const title = { swap: "Swap", drop: "Drop off", pickup: "Pick up", yard_move: "Box is at the yard", status: "Damaged or missing box" }[a];
  const atCust = boxesAtCustomer();
  $("#app").innerHTML = `
    <button class="back" onclick="screen='home'; render();">‹ Back</button>
    <div class="card"><h1>${title}</h1>
      ${needCust ? `<label>Customer</label><input id="cust" value="${esc(form.customerName)}" placeholder="Start typing…" autocomplete="off" oninput="form.customerName=this.value; form.vendorId=null; custSearch(this.value);" />
        <div id="sugg"></div>
        ${atCust.length ? `<div class="muted" style="margin-top:8px;">Boxes showing here now — tap to pick up:</div><div class="chips">${atCust.map((b) => `<button class="chip ${boxKey(form.boxOut) === boxKey(b.number) ? "on" : ""}" onclick="pickOut('${esc(b.number)}')">${esc(b.number)}</button>`).join("")}</div>` : ""}
        <label>Site / address <small>(optional)</small></label><input id="site" value="${esc(form.site)}" placeholder="e.g. Jackson Blvd shop" oninput="form.site=this.value" />` : ""}
      ${needOut ? `<label>Box picked up ${a === "swap" ? "<small>(the full one)</small>" : ""}</label><input class="big" id="bout" value="${esc(form.boxOut)}" autocomplete="off" autocapitalize="characters" placeholder="e.g. 30-11" oninput="form.boxOut=this.value; $('#hout').innerHTML=boxHint(this.value,'out');" /><div id="hout">${boxHint(form.boxOut, "out")}</div>` : ""}
      ${needIn ? `<label>${a === "swap" ? "Box dropped <small>(the empty one)</small>" : "Box #"}</label><input class="big" id="bin" value="${esc(form.boxIn)}" autocomplete="off" autocapitalize="characters" placeholder="e.g. M97" oninput="form.boxIn=this.value; $('#hin').innerHTML=boxHint(this.value,'in');" /><div id="hin">${boxHint(form.boxIn, "in")}</div>` : ""}
      ${a === "status" ? `<label>What's wrong?</label><div class="chips">${[["repair", "Damaged — needs repair"], ["missing", "Can't find it"]].map(([v, l]) => `<button class="chip ${form.newStatus === v ? "on" : ""}" onclick="form.newStatus='${v}'; render();">${l}</button>`).join("")}</div>` : ""}
      ${a === "yard_move" ? `<p class="muted" style="margin-top:10px;">Marks the box as sitting at the <b>${esc(yardName(LS.get("yard", "SB")))}</b> yard (change the yard on the first screen).</p>` : ""}
      <label>Photo <small>(optional)</small></label>
      <input type="file" accept="image/*" capture="environment" onchange="takePhoto(this)" style="font-size:16px;padding:10px;" />
      ${form.photo ? `<img class="photo-prev" src="${form.photo}" alt="Photo" />` : ""}
      <label>Notes <small>(optional)</small></label><textarea id="notes" rows="2" oninput="form.notes=this.value">${esc(form.notes)}</textarea>
      <div class="muted" id="gps" style="margin-top:10px;"></div>
      <div class="err">${esc(errMsg)}</div>
      <div style="height:14px"></div>
      <button class="btn" id="send" onclick="submitMove()" ${busy ? "disabled" : ""}>${busy ? "Sending…" : "Send"}</button>
    </div>`;
  renderGps();
}
function renderGps() { const el = $("#gps"); if (!el) return; el.textContent = gps ? `📍 Location captured (±${Math.round(gps.accuracy)} m)` : "📍 Getting location… (it's fine to send without it)"; }
function pickOut(n) { form.boxOut = n; render(); }

let custTimer = null;
function custSearch(q) {
  clearTimeout(custTimer);
  if (q.trim().length < 2) { $("#sugg").innerHTML = ""; return; }
  custTimer = setTimeout(async () => {
    let list = [];
    const ql = q.toLowerCase();
    const local = [...new Map(boxes.filter((b) => b.customer_name && b.customer_name.toLowerCase().includes(ql)).map((b) => [b.customer_name, { name: b.customer_name, site: b.site }])).values()];
    try { list = await api("/boxes/customers?q=" + encodeURIComponent(q)); } catch { list = local; }
    const el = $("#sugg"); if (!el) return;
    el.innerHTML = list.length ? `<div class="sugg">${list.slice(0, 8).map((c, i) => `<div onclick='chooseCust(${JSON.stringify(c).replace(/'/g, "&#39;")})'>${esc(c.name)}${c.site ? `<small>${esc(c.site)}</small>` : ""}</div>`).join("")}</div>` : "";
  }, 250);
}
function chooseCust(c) { form.customerName = c.name; form.vendorId = c.vendor_id || null; if (c.site && !form.site) form.site = c.site; render(); }

function takePhoto(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 1024, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    form.photo = c.toDataURL("image/jpeg", 0.6); URL.revokeObjectURL(url); render();
  };
  img.src = url;
}

async function submitMove() {
  const a = form.action;
  errMsg = "";
  if (["swap", "drop", "pickup"].includes(a) && !form.customerName.trim()) errMsg = "Enter the customer.";
  else if (["swap", "drop", "yard_move", "status"].includes(a) && !form.boxIn.trim()) errMsg = a === "swap" ? "Enter the box you dropped." : "Enter the box number.";
  else if (["swap", "pickup"].includes(a) && !form.boxOut.trim()) errMsg = "Enter the box you picked up.";
  else if (a === "swap" && boxKey(form.boxIn) === boxKey(form.boxOut)) errMsg = "Dropped and picked-up box can't be the same number.";
  if (errMsg) return render();
  const payload = {
    clientId: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
    action: a, yard: LS.get("yard", "SB"), truck: LS.get("truck", ""), driverName: me && me.name,
    customerName: form.customerName.trim() || null, vendorId: form.vendorId, site: form.site.trim() || null,
    boxIn: form.boxIn.trim().toUpperCase() || null, boxOut: form.boxOut.trim().toUpperCase() || null,
    newStatus: a === "status" ? form.newStatus : undefined, notes: form.notes.trim() || null, photo: form.photo,
    occurredAt: new Date().toISOString(), ...(gps || {}),
  };
  busy = true; render();
  try {
    const r = await api("/boxes/moves", { method: "POST", body: JSON.stringify(payload) });
    lastResult = { ok: true, warnings: r.warnings || [], payload };
  } catch (e) {
    if (e.status && e.status !== 401) { busy = false; errMsg = e.message; return render(); }   // a real problem with the entry: let them fix it
    LS.set("queue", [...queue(), payload]);                                                // no signal (or signed out): keep it
    lastResult = { ok: true, queued: true, warnings: [], payload };
  }
  busy = false; screen = "done"; render(); refreshData();
}

function renderDone() {
  const r = lastResult, p = r.payload;
  $("#app").innerHTML = `<div class="card done"><div class="big">✓</div>
    <h1>${r.queued ? "Saved on your phone" : "Sent"}</h1>
    <p>${actLabel(p.action)} · <b>${esc([p.boxIn, p.boxOut].filter(Boolean).join(" ⇄ "))}</b>${p.customerName ? " · " + esc(p.customerName) : ""}</p>
    ${r.queued ? `<p class="muted">No signal right now — it sends by itself when you're back in range.</p>` : ""}
    ${r.warnings.length ? `<div class="hint warn" style="text-align:left;">The office will double-check this:<br>${r.warnings.map(esc).join("<br>")}</div>` : ""}
    <div style="height:16px"></div><button class="btn" onclick="screen='home'; render();">Done</button></div>`;
}

render();
if (token) { refreshData(); flushQueue(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/driver-sw.js").catch(() => {});
</script>
</body>
</html>
