<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f4f4f2;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-7: #4a3aa7;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --sidebar: #14181f; --sidebar-hover: #1f2530; --sidebar-text: #b7bcc7; --sidebar-muted: #6f7581;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #101012; --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-7: #9085e9;
      --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--text-primary); }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 232px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-text); display: flex; flex-direction: column; }
  .brandrow { display:flex; align-items:center; gap:10px; padding: 18px 18px 14px; }
  .brandmark { width:34px; height:34px; border-radius:8px; background: #fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:4px; box-sizing:border-box; }
  .brandmark img { width:100%; height:100%; object-fit:contain; }
  .brandtext { font-weight: 700; font-size: 13.5px; color: white; line-height:1.25; }
  .brandtext small { display:block; font-weight:400; color: var(--sidebar-muted); font-size: 10.5px; letter-spacing:.03em; }
  .nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 1px; overflow-y:auto; flex:1; }
  .navitem { all: unset; cursor: pointer; display:flex; align-items:center; gap:10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
  .navitem svg { width:15px; height:15px; flex-shrink:0; opacity:.85; }
  .navitem:hover { background: var(--sidebar-hover); color: white; }
  .navitem.active { background: var(--series-1); color: white; font-weight: 600; }
  .navitem.active svg { opacity:1; }
  .navfoot { padding: 12px 18px 16px; border-top: 1px solid rgba(255,255,255,.08); font-size: 10.5px; color: var(--sidebar-muted); }
  .content { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { height: 58px; flex-shrink:0; background: var(--surface-1); border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding: 0 22px; }
  .topbar h1 { font-size: 15.5px; margin:0; }
  .topbar-right { display:flex; align-items:center; gap:14px; }
  .yardsel select { font-size:12.5px; color: var(--text-primary); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; background: var(--surface-1); font-family:inherit; }
  .bell { position:relative; cursor:pointer; }
  .bell svg { width:19px; height:19px; color: var(--text-secondary); }
  .bell .dot { position:absolute; top:-3px; right:-4px; background: var(--critical); color:white; font-size:9.5px; font-weight:700; border-radius:999px; padding: 1px 4.5px; }
  .notif-wrap { position:relative; }
  .notif-panel { position:absolute; top:32px; right:-8px; width:340px; max-height:420px; overflow-y:auto; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.16); z-index:50; }
  .notif-panel .np-head { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border); font-size:12px; font-weight:700; }
  .notif-panel .np-head .link { font-size:11px; font-weight:600; cursor:pointer; color: var(--series-1); }
  .notif-item { padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:12px; }
  .notif-item:last-child { border-bottom:none; }
  .notif-item:hover { background: var(--sidebar-hover, rgba(0,0,0,.03)); }
  .notif-item.unread { background: rgba(42,120,214,.06); }

let commoditySeq = 1;

function findCommodity(code) { return commodities.find(c => c.code === code); }
function commodityName(code) { if (!code) return "—"; const c = findCommodity(code); return c ? c.name : code; }
// masterPriceAtYard: our expected sale price for this commodity at this yard (master price × yard multiplier). Used for sell tickets.
function masterPriceAtYard(code, yard) {
  const c = findCommodity(code); if (!c) return 0;
  return r3(c.masterPrice * (YARD_MULT[yard] ?? 1));
}
// tierPrice: what a dealer at this tier gets paid for this commodity at this yard — master price at yard, minus that tier's margin. Used for buy tickets.
function tierPrice(code, yard, tier) {
  const t = tier || "scale";
  return r3(masterPriceAtYard(code, yard) * (1 - (tierMargins[t] ?? 0)));
}
function tierLookupPrice(code, yard, tier) { return tierPrice(code, yard, tier); }

/* ---------------- Unit of measure ----------------
   For weight-based commodities (lb / net ton / gross ton), prices/costs are stored internally as ONE
   canonical $/lb figure everywhere (tickets, master price, avg cost, ledger, mill recon, transfers) —
   that never changes, so every dollar total in the app stays correct no matter what unit a screen
   chooses to quote in. Count-based commodities (each — e.g. whole catalytic converters, which aren't
   scaled/weighed) instead have their canonical figure directly in $/EA — there's no fixed lb-per-unit
   conversion for a converter, so "each" is its own base unit rather than a display conversion of lb,
   and its factor is 1 (no scaling). Either way, what changes per commodity is only how its own rate
   gets DISPLAYED and ENTERED: each commodity has its own unit of measure (lb / net ton / gross ton /
   each, editable on Commodities), defaulting ferrous items to net ton and Converter-category items to
   each since that's how they're priced/counted in the real world. displayRate()/fromDisplayRate() are
   the only two functions that ever need to know about this — every screen that shows or accepts a
   per-unit price goes through them. Quantity (on-hand, ticket weight/count) uses the separate
   qtyUnitLabel()/fmtQty() helpers below: "each" commodities are counted in EA, not weighed in lb, so
   their ticket entry captures a quantity directly rather than a gross/tare scale weight. */
const UNITS = {
  lb:        { label: "lb",                    shortLabel: "/lb",        factor: 1 },
  net_ton:   { label: "net ton (2,000 lb)",     shortLabel: "/net ton",   factor: 2000 },
  gross_ton: { label: "gross ton (2,240 lb)",   shortLabel: "/gross ton", factor: 2240 },
  each:      { label: "each (EA)",              shortLabel: "/EA",        factor: 1 },
};
function commodityUnit(code) { const c = findCommodity(code); return (c && UNITS[c.unit]) ? c.unit : "lb"; }
function unitFactor(code) { return UNITS[commodityUnit(code)].factor; }
function unitShortLabel(code) { return UNITS[commodityUnit(code)].shortLabel; }
function unitLongLabel(code) { return UNITS[commodityUnit(code)].label; }
function isEachUnit(code) { return commodityUnit(code) === "each"; }
// A real $/lb figure, converted into this commodity's configured display unit.
function displayRate(code, perLb) { return (perLb || 0) * unitFactor(code); }
// A value entered in this commodity's configured display unit, converted back to real $/lb for storage/math.
function fromDisplayRate(code, displayValue) { const f = unitFactor(code); return f ? (displayValue || 0) / f : (displayValue || 0); }
// Fully formatted, e.g. "$212.00/net ton", "$3.58/lb", or "$103.17/EA".
function fmtRate(code, perLb) { return fmtMoney(displayRate(code, perLb)) + unitShortLabel(code); }
// Quantity/on-hand units are separate from price units: a ferrous item still tracks physical on-hand
// weight in lb even though its PRICE is quoted per net ton — "each" is the one unit where the physical
// quantity itself is a count, not a weight, so it's the only case qtyUnitLabel diverges from "lb".
function qtyUnitLabel(code) { return isEachUnit(code) ? "EA" : "lb"; }
function fmtQty(code, qty) { return (qty || 0).toLocaleString() + " " + qtyUnitLabel(code); }

/* Sell side: what we quote a customer for material we're selling THEM (Price Lists tab). Master (sale) price at that
   yard, minus that customer's own freight cost, minus a tier-based margin — same DH/D1/D2/Scale tiers as dealers,
   reused here for customers per how tightly Langer wants to price with them, but tracked as a separate margin
   schedule since buy-side and sell-side spreads are set independently. */
let sellTierMargins = { scale: 0.10, d2: 0.065, d1: 0.04, dh: 0.015 };
function customerPrice(code, yard, customerId) {
  const cust = findCustomer(customerId);
  const master = masterPriceAtYard(code, yard);
  const freight = cust ? (cust.freightPerLb || 0) : 0;
  const marginPct = sellTierMargins[cust ? cust.tier : "scale"] ?? 0;
  return r3(Math.max(0, master - freight - r3(master * marginPct)));
}

/* ---------------- Inventory (per yard, weighted-average cost) ---------------- */
// inventoryByYard[yard][code] = { qty, avgCost }  — avgCost is $/lb, recalculated on every buy (moving average);
// unaffected by sells/adjustments so "cash cost" (qty * avgCost) always reflects real dollars tied up in what's on hand.
let inventoryByYard = { SB:{}, HAYS:{}, COLBY:{}, RC:{} };
let inventoryLedger = [];
let ledgerSeq = 1;
let seedQty = { SB:{}, HAYS:{}, COLBY:{}, RC:{} };
(function seedInventory() {
  const base = { "HMS1":48200,"HMS2":31500,"AL-CANS":900,"AL-SHEET":1100,"AL-CAST":3400,"AL-EC":2100,"RIM-AL":650,"RAD-AUTO":420,
    "CU-BB":640,"CU-1":1120,"CU-2":760,"ICW-THHN":380,"BRASS-Y":410,"BRASS-R":260,"CB-MOTOR":300,"LEAD-WW":520,"SS-304":5200,"SS-316":900 };
  const split = { SB:0.40, HAYS:0.22, COLBY:0.20, RC:0.18 };
  YARDS.forEach(y => { commodities.forEach(c => { seedQty[y.code][c.code] = Math.round((base[c.code]||0) * split[y.code]); }); });
})();
let inventoryAdjustments = [];

// Every posting to inventory carries a real timestamp, not just a date, so an item's ledger reads like
// an actual activity log. Historical/seed activity gets a plausible staggered business-hours time
// (deterministic, so the demo is reproducible); anything posted live during this session is stamped
// with the actual clock time the action was taken.
let seedTimeSeq = 0;
function nextSeedTime() {
  const totalMinutes = (415 + seedTimeSeq * 17) % 630; // walks 6:55am..5:25pm, deterministic spread
  seedTimeSeq++;
  const h24 = 7 + Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  const ampm = h24 >= 12 ? "PM" : "AM";
  const h12 = ((h24 + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
}
function nowTimeLabel() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
const LEDGER_TYPE_LABEL = { "Opening": "Opening Balance", "Buy": "Purchased In", "Sell": "Sold",
  "Transfer In": "Transfer In", "Transfer Out": "Transfer Out", "Pack": "Packed", "Unpack": "Unpacked", "Adjustment": "Adjusted",
  "Correction": "Negative Correction", "Regrade in": "Regrade In", "Regrade out": "Regrade Out", "Import": "Inventory Valuation Import",
  "Freight-in": "Freight Capitalized" };

function logLedger(yard, code, type, qtyChange, unitPrice, balanceQty, avgCost, ref, date, live = true) {
  const time = live ? nowTimeLabel() : nextSeedTime();
  inventoryLedger.push({ id: "L" + (ledgerSeq++), date, time, yard, code, type, qtyChange, unitPrice, balanceQty, avgCost: r3(avgCost), cashCost: r2(balanceQty * avgCost), ref });
}
function applyInventoryBuy(yard, code, qty, price, ref, date = CURRENT_DATE, live = true, typeLabel = "Buy") {
  const inv = inventoryByYard[yard][code];
  const newQty = inv.qty + qty;
  const newAvgCost = newQty > 0 ? r3((inv.qty * inv.avgCost + qty * price) / newQty) : price;
  inv.qty = newQty; inv.avgCost = newAvgCost;
  logLedger(yard, code, typeLabel, qty, price, newQty, newAvgCost, ref, date, live);
}
// Note: qty can legitimately go negative here — see the "Fixing negative inventory" note below.
function applyInventorySell(yard, code, qty, ref, date = CURRENT_DATE, live = true, typeLabel = "Sell") {
  const inv = inventoryByYard[yard][code];
  const newQty = inv.qty - qty;
  inv.qty = newQty; // moving-average cost is unaffected by outflows
  logLedger(yard, code, typeLabel, -qty, null, newQty, inv.avgCost, ref, date, live);
}
// Fixing negative inventory: on-hand can legitimately go negative here (a sell ticket posted before the
// physical count catches up, two people working the same pile, etc.) — the old prototype silently
// floored every outflow at zero, which hid real shortfalls instead of surfacing them. Now a negative
// balance shows up plainly (see the Negative Inventory panel/badges on the On Hand tab) and gets fixed
// the same way a real recount would: post an Adjustment (or use the dedicated "Fix" action, which posts
// an Adjustment tagged "Correction") that brings the balance to the freshly counted true quantity.
function applyInventoryAdjustment(yard, code, deltaQty, reason, date = CURRENT_DATE, live = true, typeLabel = "Adjustment") {
  const inv = inventoryByYard[yard][code];
  const newQty = inv.qty + deltaQty;
  inv.qty = newQty;
  logLedger(yard, code, typeLabel, deltaQty, null, newQty, inv.avgCost, reason, date, live);
}
// Upgrade/downgrade one commodity into another (e.g. #1 -> #2 Copper, or insulated wire stripped into bare bright).
// The dollar value that comes OUT of the "from" commodity becomes the cost basis for what's added to the "to" commodity,
// so re-grading material doesn't invent or destroy inventory value — it just moves it, blended into whatever's already
// on hand for the "to" commodity. From/To quantities can differ to reflect processing yield loss (or gain).
// Regrading can only ever lose mass or break even — trimming, drying, or stripping contamination
// out never adds pounds — so the "to" side is hard-capped at the "from" side no matter what a caller
// passes in. This is what keeps a regrade from manufacturing inventory out of thin air; the UI-level
// check in convertInventory() below gives the operator a clear message instead of a silent clamp.
function applyInventoryConversion(yard, fromCode, fromQty, toCode, toQty, reason, date = CURRENT_DATE, live = true) {
  const cappedToQty = Math.min(toQty, fromQty);
  const fromInv = inventoryByYard[yard][fromCode];
  const movedValue = r2(fromQty * fromInv.avgCost);
  const newFromQty = fromInv.qty - fromQty;
  fromInv.qty = newFromQty;
  logLedger(yard, fromCode, "Regrade out", -fromQty, fromInv.avgCost, newFromQty, fromInv.avgCost, reason, date, live);
  const toInv = inventoryByYard[yard][toCode];
  const unitCostIn = cappedToQty > 0 ? r3(movedValue / cappedToQty) : 0;
  const newToQty = toInv.qty + cappedToQty;
  const newToAvgCost = newToQty > 0 ? r3((toInv.qty * toInv.avgCost + cappedToQty * unitCostIn) / newToQty) : unitCostIn;
  toInv.qty = newToQty; toInv.avgCost = newToAvgCost;
  logLedger(yard, toCode, "Regrade in", cappedToQty, unitCostIn, newToQty, newToAvgCost, reason, date, live);
}
// Every inventory adjustment is ultimately the owner's call (the "adjustInventory" permission — Admin
// only by default). Anyone else who spots a negative balance or a count discrepancy can still flag it,
// but it goes into a pending-approval queue instead of touching on-hand until the owner reviews it.

function requestInventoryAdjustment(yard, code, deltaQty, reason) {
  const id = "AR-" + (adjReqSeq++);
  inventoryAdjustmentRequests.push({ id, date: CURRENT_DATE, time: nowTimeLabel(), yard, code, deltaQty: r2(deltaQty), reason, requestedBy: currentUserId, status: "Pending", reviewedBy: null, reviewNote: null });
  return id;
}
function approveAdjustmentRequest(id) {
  if (!can('adjustInventory')) { alert("You don't have access to approve inventory adjustments."); return; }
  const req = inventoryAdjustmentRequests.find(r => r.id === id);
  if (!req || req.status !== "Pending") return;
  const typeLabel = req.reason.startsWith("Negative inventory correction") ? "Correction" : "Adjustment";
  const requester = findUser(req.requestedBy);
  applyInventoryAdjustment(req.yard, req.code, req.deltaQty, `${req.reason} (approved — requested by ${requester ? requester.name : "—"})`, CURRENT_DATE, true, typeLabel);
  req.status = "Approved";
  req.reviewedBy = currentUserId;
  render();
}
function rejectAdjustmentRequest(id) {
  if (!can('adjustInventory')) { alert("You don't have access to review inventory adjustments."); return; }
  const req = inventoryAdjustmentRequests.find(r => r.id === id);
  if (!req || req.status !== "Pending") return;
  const note = prompt("Reason for rejecting this request (optional):", "");

// Dedicated fix for a negative on-hand balance: prompts for the freshly recounted true quantity (default
// 0). Owners apply it immediately, tagged "Correction" in the ledger; everyone else submits it as a
// pending adjustment request — the balance stays negative until the owner approves it.
function fixNegativeInventory(yard, code) {
  const current = getInventoryQty(yard, code);
  const input = prompt(`${commodityName(code)} at ${yardName(yard)} shows ${fmtQty(code, current)} on hand.\n\nEnter the correct on-hand quantity from a physical recount:`, "0");
  if (input === null) return;
  const target = parseFloat(input);
  if (isNaN(target) || target < 0) { alert("Enter a quantity of zero or more."); return; }
  const delta = r2(target - current);
  if (delta === 0) { render(); return; }
  const reason = `Negative inventory correction — recounted at ${fmtQty(code, target)}`;
  if (can('adjustInventory')) {
    applyInventoryAdjustment(yard, code, delta, reason, CURRENT_DATE, true, "Correction");
    inventoryAdjustments.push({ date: CURRENT_DATE, yard, code, qty: delta, reason: "Negative inventory correction (recount)" });
  } else {
    requestInventoryAdjustment(yard, code, delta, reason);
    alert(`Submitted for owner approval: correcting ${commodityName(code)} at ${yardName(yard)} to ${fmtQty(code, target)}. On-hand stays negative until it's approved.`);
  }
  render();
}
function findNegativeInventory(yards) {
  const rows = [];
  yards.forEach(yc => commodities.forEach(c => {
    const qty = inventoryByYard[yc][c.code]?.qty || 0;
    if (qty < 0) rows.push({ yard: yc, code: c.code, qty });
  }));
  return rows;
}
function getInventoryQty(yard, code) {
  if (yard === "CORP") return realYardCodes().reduce((s, yc) => s + (inventoryByYard[yc][code]?.qty || 0), 0);
  return inventoryByYard[yard]?.[code]?.qty || 0;
}
function getInventoryCashCost(yard, code) {
  if (yard === "CORP") return realYardCodes().reduce((s, yc) => { const inv = inventoryByYard[yc][code]; return s + (inv ? inv.qty * inv.avgCost : 0); }, 0);
  const inv = inventoryByYard[yard]?.[code]; return inv ? inv.qty * inv.avgCost : 0;
}
function getInventoryAvgCost(yard, code) {
  if (yard === "CORP") { const q = getInventoryQty("CORP", code); return q > 0 ? r3(getInventoryCashCost("CORP", code) / q) : 0; }
  return inventoryByYard[yard]?.[code]?.avgCost || 0;
}

/* ---------------- Shipments — groups multiple sell tickets that went out on one load ----------------
   NF loads are typically mixed (many commodities on one truck), so a Shipment groups the sell tickets
   created together purely for document generation (Invoice/Packing List/BOL) and display — every
   per-commodity inventory/COGS/AR/Gross-Profit/contract mechanic still runs off the individual tickets
   exactly as before. A single-commodity sale (the common case for ferrous) still gets its own
   one-ticket Shipment, so nothing downstream has to know the difference. */
let shipments = [];
let shipmentSeq = 2001;
function findShipment(id) { return shipments.find(s => s.id === id); }
function shipmentForTicket(ticketId) {
  const t = tickets.find(x => x.id === ticketId);
  return t && t.shipmentId ? findShipment(t.shipmentId) : null;
}
function shipmentTickets(shipment) { return shipment.ticketIds.map(id => tickets.find(t => t.id === id)).filter(Boolean); }
// Legacy/ungrouped tickets (seeded data, or anything predating this feature) don't have a real Shipment
// record — treat them as their own single-item shipment so documents still generate correctly.
function resolveShipmentForTicket(ticketId) {
  const real = shipmentForTicket(ticketId);
  if (real) return real;
  const t = tickets.find(x => x.id === ticketId);
  if (!t) return null;
  return { id: t.id, yard: t.yard, date: t.date, partyId: t.partyId, party: t.party, bolNumber: null, notes: "", ticketIds: [t.id] };
}
function daysUntil(dateStr) {
  const end = new Date(dateStr + "T00:00:00");
  const now = new Date(CURRENT_DATE + "T00:00:00");
  return Math.round((end - now) / 86400000);
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}),
      ...(opts.headers || {}),
    },
  });
  let body = null;
  try { body = await res.json(); } catch {}
  if (!res.ok) throw new Error((body && body.error) || `Request failed (${res.status})`);
  return body;
}

function mapApiCommodity(c) {
  return {
    code: c.code, name: c.name, category: c.category, ferrous: !!c.ferrous, unit: c.unit,
    lowThreshold: parseFloat(c.low_threshold) || 0, masterPrice: parseFloat(c.master_price) || 0,
    kiosk: { show: !!c.kiosk_show, color: c.kiosk_color }, askPrice: !!c.ask_price,
  };
}
function mapApiTicket(t) {
  return {
    id: t.id, type: t.type, date: t.date, yard: t.yard,
    party: t.party_name, partyId: t.vendor_id || t.customer_id || null,
    commodity: t.commodity, tier: t.tier, netWeight: parseFloat(t.net_weight), price: parseFloat(t.price),
    total: parseFloat(t.total), payment: t.payment, synced: !!t.synced, paid: !!t.paid,
    remittanceId: t.remittance_id, status: t.status, cogsPerLb: t.cogs_per_lb != null ? parseFloat(t.cogs_per_lb) : null,
    contractId: t.contract_id, poId: t.po_id, shipmentId: t.shipment_id, holdDescription: t.hold_desc,
  };
}
function mapApiVendor(v) {
  return {
    id: v.id, name: v.name, phone: v.phone || "", email: v.email || "", tier: v.tier, notes: v.notes || "",
    smartphone: !!v.smartphone, onPriceList: !!v.on_price_list, autoSend: v.auto_send || "off",
    lastSent: v.last_sent ? v.last_sent.slice(0, 10) : null, created: v.created_at ? v.created_at.slice(0, 10) : null,

// Creates a vendor or customer in the database and adds it to the local list. Field names match
// what POST /vendors and POST /customers accept.
async function createParty(kind, fields) {
  const row = await apiFetch(kind === "vendor" ? "/vendors" : "/customers", { method: "POST", body: JSON.stringify(fields) });
  const rec = kind === "vendor" ? mapApiVendor(row) : mapApiCustomer(row);
  (kind === "vendor" ? vendors : customers).push(rec);
  return rec;
}
// Saves one or more changed fields on a vendor/customer. The local record is updated first so the
// screen responds immediately; if the save fails the change is rolled back and the user told.
async function patchParty(kind, id, fields) {
  const rec = kind === "vendor" ? findVendor(id) : findCustomer(id);
  if (!rec) return;
  const before = {};
  Object.keys(fields).forEach(k => { before[k] = rec[k]; rec[k] = fields[k]; });
  render();
  try {
    await apiFetch(`${kind === "vendor" ? "/vendors" : "/customers"}/${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify(fields) });
  } catch (err) {
    Object.assign(rec, before);
    alert("Couldn't save that change: " + err.message);
    render();
  }
}

// Replaces the local demo seed data with real data from the database. Called once right after
// login. Any (yard, commodity) pair with no rows yet in inventory_balances is left at qty 0 /
// avgCost = that commodity's master price, matching how the backend itself would start it.
async function bootstrapFromApi() {
  const [apiCommodities, balances, ledger, apiTickets, apiVendors, apiCustomers] = await Promise.all([
    apiFetch("/commodities"),
    apiFetch("/inventory/balances"),
    apiFetch("/inventory/ledger?limit=1000"),
    apiFetch("/tickets?limit=1000"),
    apiFetch("/vendors"),
    apiFetch("/customers"),
  ]);

  commodities = apiCommodities.map(mapApiCommodity);
  vendors = apiVendors.map(mapApiVendor);
  customers = apiCustomers.map(mapApiCustomer);

  inventoryByYard = { SB: {}, HAYS: {}, COLBY: {}, RC: {} };
  YARDS.forEach(y => { commodities.forEach(c => { inventoryByYard[y.code][c.code] = { qty: 0, avgCost: c.masterPrice }; }); });
  balances.forEach(b => {
    if (!inventoryByYard[b.yard]) inventoryByYard[b.yard] = {};
    inventoryByYard[b.yard][b.commodity] = { qty: parseFloat(b.qty), avgCost: parseFloat(b.avg_cost) };
  });

  inventoryLedger = ledger.map(l => ({
    id: l.id, date: l.date, time: l.time || "", yard: l.yard, code: l.commodity, type: l.type,
    qtyChange: parseFloat(l.qty_change), unitPrice: l.unit_price != null ? parseFloat(l.unit_price) : null,
    balanceQty: parseFloat(l.balance_qty), avgCost: parseFloat(l.avg_cost), cashCost: parseFloat(l.cash_cost), ref: l.ref,
  })).reverse(); // API returns newest-first; local convention appends oldest-first

  tickets = apiTickets.map(mapApiTicket).reverse();
}

async function refreshInventoryFor(yard, codes) {
  const results = await Promise.all(codes.map(code => apiFetch(`/inventory/balances?yard=${encodeURIComponent(yard)}&commodity=${encodeURIComponent(code)}`)));
  results.forEach((rows, i) => {
    if (rows.length) inventoryByYard[yard][codes[i]] = { qty: parseFloat(rows[0].qty), avgCost: parseFloat(rows[0].avg_cost) };
  });
}

function showLoginError(msg) {
  const el = document.getElementById("login-error");
  el.textContent = msg;
  el.style.display = "block";
}

async function doLogin(event) {
  event.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("login-submit");
  btn.disabled = true; btn.textContent = "Signing in…";
  document.getElementById("login-error").style.display = "none";
  try {
    const data = await apiFetch("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    authToken = data.token;
    apiUser = data.user;
    await bootstrapFromApi();
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appRoot").style.display = "";
    render();
  } catch (err) {
    showLoginError(err.message || "Sign in failed.");
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

/* Turn the seeded quantities into real opening balances (dated start-of-month) then replay the
   seed tickets through the costing functions so today's qty/avg-cost/ledger all derive honestly
   from the same math a live system would use — not just asserted numbers. */
(function initializeInventoryCosting() {
  const MONTH_START = "2026-08-01";
  YARDS.forEach(y => {
    commodities.forEach(c => {
      const finalQty = seedQty[y.code][c.code] || 0;
      const scalePrice = tierPrice(c.code, y.code, "scale");
      const yardTickets = tickets.filter(t => t.yard === y.code && t.commodity === c.code).sort((a, b) => a.id.localeCompare(b.id));
      const netEffect = yardTickets.reduce((s, t) => s + (t.type === "buy" ? t.netWeight : -t.netWeight), 0);

      inventoryByYard[y.code][c.code] = { qty: openingQty, avgCost: scalePrice };
      logLedger(y.code, c.code, "Opening", openingQty, null, openingQty, scalePrice, "Opening balance", MONTH_START, false);

/* ---------------- Yard Transfers ----------------
   Each yard is its own profit center, not a cost center (Andy's correction) — so a transfer between
   yards is handled like a real sale, not a silent inventory move. Moving material from Colby to Hays
   creates TWO real, linked tickets: a "sell" at Colby (Colby books the margin between its own cost
   and the transfer price — real profit, same as selling to any outside buyer) and a "buy" at Hays
   (Hays' cost basis becomes the transfer price it paid Colby). Both tickets flow through the exact
   same inventory math as any other ticket (applyInventorySell/applyInventoryBuy), so they show up
   in that yard's own Dashboard KPIs, gross margin, ticket lists, and QuickBooks sync exactly like a
   real transaction — `kind:"transfer"` is just a tag so KBI reporting, Mill Reconciliation, and the
   Volumes report's Purchased/Sold columns know to leave them out (they're not a purchase from the
   public or a sale to a mill, so they don't belong there — the real Volumes sheet reports "Langer
   Yard Xfer" as its own separate line, which is what this still does).
   At the Corporate rollup, one yard's transfer "sell" total and the other's transfer "buy" total
   are equal and offsetting, so the internal margin washes out of consolidated Gross Margin — the
   same elimination a real multi-entity close would do, and it falls out of the ticket math for free.
   Known simplification: the buy leg is marked paid immediately — no actual cash moves between yard
   bank accounts for the transfer itself. A real build would need Hays to actually settle that
   internal invoice with Colby (or true it up at reconciliation) — that's a separate feature from
   "does each yard's own book show the right profit," which is what this fixes. */
let yardTransferMarginPct = 6; // company default, prefilled on a new transfer — each transfer can still set its own basis/value
let yardTransfers = []; // one row per transfer event, for the Yard Transfers screen + the Transfer Ledger — the real accounting lives in `tickets`
let yardTransferSeq = 1;
const MARGIN_BASES = { pct: "%", perlb: "$/lb", perton: "$/net ton" };
function marginLabel(basis, value) {
  if (basis === "perlb") return `${fmtMoney(value)}/lb`;
  if (basis === "perton") return `${fmtMoney(value)}/NT`;
  return `${value}%`;
}
// Margin is adjustable per transfer, in whichever unit makes sense for that load — a flat percent
// over master price, or a flat $ amount per lb or per net ton (common for negotiated intercompany
// rates that don't move with price the way a percent does).
function computeTransferPrice(code, fromYard, marginBasis, marginValue) {
  const master = masterPriceAtYard(code, fromYard);
  if (marginBasis === "perlb") return r3(master + marginValue);
  if (marginBasis === "perton") return r3(master + marginValue / 2000);
  return r3(master * (1 + marginValue / 100));
}
function updateYardTransferMargin(v) { yardTransferMarginPct = Math.max(0, parseFloat(v) || 0); render(); }
function createYardTransfer(fromYard, toYard, code, qty, marginBasis, marginValue, notes, date = CURRENT_DATE, live = true) {
  if (fromYard === toYard) { alert("Choose a different destination yard."); return null; }
  if (qty <= 0) { alert(isEachUnit(code) ? "Enter a quantity greater than zero." : "Enter a weight greater than zero."); return null; }
  const avail = getInventoryQty(fromYard, code);
  if (qty > avail) { alert(`Only ${fmtQty(code, avail)} of ${commodityName(code)} on hand at ${yardName(fromYard)}.`); return null; }
  const price = computeTransferPrice(code, fromYard, marginBasis, marginValue);
  const total = r2(qty * price);
  const xferId = "YT-" + (yardTransferSeq++);
  const sellId = "S-" + (ticketSeqSell++);
  const buyId = "B-" + (ticketSeq++);
  const cogsPerLb = getInventoryAvgCost(fromYard, code);
  tickets.push({ id: sellId, type: "sell", date, yard: fromYard, party: `Yard Transfer → ${yardName(toYard)}`, partyId: null,
    commodity: code, tier: null, netWeight: qty, price, total, payment: "Internal Transfer", synced: false, cogsPerLb,
    paid: false, remittanceId: null, kind: "transfer", transferId: xferId, transferPeerYard: toYard, linkedTicketId: buyId });
  tickets.push({ id: buyId, type: "buy", date, yard: toYard, party: `Yard Transfer ← ${yardName(fromYard)}`, partyId: null,
    commodity: code, tier: null, netWeight: qty, price, total, payment: "Internal Transfer", synced: false,
    paid: true, remittanceId: null, kind: "transfer", transferId: xferId, transferPeerYard: fromYard, linkedTicketId: sellId });
  applyInventorySell(fromYard, code, qty, sellId, date, live, "Transfer Out");
  applyInventoryBuy(toYard, code, qty, price, buyId, date, live, "Transfer In");
  const xfer = { id: xferId, date, fromYard, toYard, commodity: code, netWeight: qty, marginBasis, marginValue, price, total,
    notes: notes || "", sellTicketId: sellId, buyTicketId: buyId, status: "Open", reconciledDate: null };
  yardTransfers.push(xfer);
  return xfer;
}
function findYardTransfer(id) { return yardTransfers.find(x => x.id === id); }
function reconcileYardTransfer(id) {
  const x = findYardTransfer(id);
  if (!x || x.status === "Reconciled") return;
  x.status = "Reconciled";
  x.reconciledDate = CURRENT_DATE;
  render();

   0.01 is a deliberate placeholder: "we know freight is owed, we don't know the real number yet" —

let freightTickets = [
  { id:"FT-1", ticketId:"S-2091", carrierId:"cr1", laneId:"FL1", origin:"Scottsbluff, NE", destination:"Nucor Steel Kingman", cost:850, status:"Reconciled", date:"2026-08-17", notes:"", paid:true, remittanceId:null },
];

function freightForTicket(ticketId) { return freightTickets.filter(f => f.ticketId === ticketId); }

/* Each scale ticket (inbound or outbound) can carry at most one freight ticket — createFreightTicket()
   is the single choke point every attach path routes through, so that rule can't be bypassed. Returns
   the new freight ticket, or null if one is already attached (caller decides how to surface that). */
function createFreightTicket({ ticketId, carrierId, laneId, origin, destination, cost, placeholder, notes }) {
  if (freightForTicket(ticketId).length > 0) return null;
  const ft = { id: "FT-" + (freightSeq++), ticketId, carrierId, laneId, origin, destination, cost, status: placeholder ? "Estimated" : "Reconciled", date: CURRENT_DATE, notes: notes || "", paid: false, remittanceId: null, capitalizedAmount: 0, capitalizedNote: null };
  freightTickets.push(ft);
  capitalizeInboundFreight(ft.id);
  return ft;
}
// Inbound freight (attached to a BUY ticket — hauling material INTO the yard) is a landed cost: it gets
// capitalized straight into that commodity's inventory cost basis, spread over the shipment's own net
// weight (freight $ ÷ weight = a $/lb add-on, same units as the price paid to the dealer). Outbound
// freight (attached to a SELL ticket — shipping material OUT to a customer) is deliberately never
// capitalized — per Andy's call, it stays a pure AP/period cost, already deducted straight off gross
// profit on the Gross Profit report via freightCostForTicket(). Re-run this after a placeholder freight
// cost gets reconciled to the real number so only the delta (not the whole amount twice) gets added.
// Known simplification: avgCost is one blended moving-average pool per commodity/yard, not lot-tracked,
// so this only lands cleanly while the shipment's own weight is still substantially on hand — if it's
// already fully resold by the time freight is attached/reconciled, there's nothing left to capitalize
// onto and the freight cost simply stays an uncapitalized payable (flagged via capitalizedNote).
function capitalizeInboundFreight(freightTicketId) {
  const f = freightTickets.find(x => x.id === freightTicketId);
  if (!f) return;
  const t = tickets.find(x => x.id === f.ticketId);
  if (!t || t.type !== "buy") { f.capitalizedNote = null; return; } // outbound/sell freight is never capitalized
  const already = f.capitalizedAmount || 0;
  const delta = r2(f.cost - already);
  if (Math.abs(delta) < 0.005) return;
  const inv = inventoryByYard[t.yard] && inventoryByYard[t.yard][t.commodity];
  if (!inv || inv.qty <= 0) {
    f.capitalizedNote = "Not capitalized — no matching inventory on hand at " + yardName(t.yard);
    return;
  }
  const newAvgCost = r3((inv.qty * inv.avgCost + delta) / inv.qty);
  inv.avgCost = newAvgCost;
  logLedger(t.yard, t.commodity, "Freight-in", 0, r3(delta / inv.qty), inv.qty, newAvgCost, f.id, CURRENT_DATE, true);
  f.capitalizedAmount = f.cost;
  f.capitalizedNote = null;
}

/* ---------------- Aged Payables — recalculated against CURRENT_DATE on every load,
   so it always reflects "as of today" without needing an actual overnight batch job. */
const AGING_BUCKETS = [
  { key:"current", label:"Current (0–30d)" },
  { key:"b31_60", label:"31–60d" },
  { key:"b61_90", label:"61–90d" },
  { key:"b90_plus", label:"90d+" },
];
function daysSince(dateStr) {
  const then = new Date(dateStr + "T00:00:00");
  const now = new Date(CURRENT_DATE + "T00:00:00");
  return Math.round((now - then) / 86400000);
}
function agingBucketKey(days) {
  if (days <= 30) return "current";
  if (days <= 60) return "b31_60";
  if (days <= 90) return "b61_90";
  return "b90_plus";
}
// Scoped to payables tied to a purchase made at a specific yard (a vendor/carrier may also
// have open payables from other yards — those show up when that yard's Cashier is viewed).
function yardAgedPayables(yard) {
  const byPayee = {};
  allPayeeNames().forEach(name => {
    payeeUnpaidLines(name).filter(l => l.yard === yard).forEach(l => {
      const days = daysSince(l.date);
      const bucket = agingBucketKey(days);
      if (!byPayee[name]) byPayee[name] = { payee: name, current:0, b31_60:0, b61_90:0, b90_plus:0, total:0, oldestDays:0 };
      byPayee[name][bucket] += l.amount;
      byPayee[name].total += l.amount;
      byPayee[name].oldestDays = Math.max(byPayee[name].oldestDays, days);
    });
  });
  return Object.values(byPayee).sort((a,b) => b.oldestDays - a.oldestDays);
}

/* ---------------- Accounts Receivable — the mirror image of Payables above. Invoices go out at
   shipment (same as Mill Reconciliation already assumes); what's owed is tracked by TERMS/due date
   rather than "closed but unpaid" since there's no scale-side hold step on the sell side. Only sales
   to a real customer record are tracked here — same as Walk-in purchases never appearing in Payables,
   a Walk-in sale is assumed settled on the spot rather than becoming a receivable. */

function effectiveTerms(contractId, customerId) {
  const c = contractId ? findContract(contractId) : null;
  if (c && c.terms) return c.terms;
  const cust = customerId ? findCustomer(customerId) : null;
  return (cust && cust.terms) || "cod";
}
// Resolves a ticket's terms/due date from what was snapshotted at invoice time; falls back to
// computing live (off today's customer/contract terms) for tickets created before this feature existed.
function resolveTicketTerms(t) {
  if (t.terms && t.dueDate) return { terms: t.terms, dueDate: t.dueDate };
  const terms = effectiveTerms(t.contractId, t.partyId);
  return { terms, dueDate: addDays(t.date, TERMS_DAYS[terms] || 0) };
}
function arEligibleTickets() { return tickets.filter(t => t.type === "sell" && t.kind !== "transfer"); }
function invoiceAmountForTicket(t) { return t.millRecon ? t.millRecon.confirmedTotal : t.total; }

  let sum = 0;
  receivablePayments.forEach(p => { if (p.voided) return; p.lines.forEach(l => { if (l.ticketId === ticketId) sum += l.amount; }); });

}

}

/* ---------------- Volumes (Dashboard) ----------------
   Rebuilds the "Volumes" workbook the controller currently hand-compiles from ScrapDragon reports
   and emails to the whole yard, straight into the Dashboard — computed live from real tickets,
   freight, and yard transfers instead of pasted-together reports. "Weekly" is the trailing 7 days;
   "Monthly" is the calendar month to date, matching how the real sheet is read day to day. */
function inPeriod(dateStr, period) {
  if (period === "daily") return dateStr === CURRENT_DATE;
  if (period === "weekly") {
    const d = new Date(dateStr + "T00:00:00");
    const end = new Date(CURRENT_DATE + "T00:00:00");
    const diff = Math.round((end - d) / 86400000);
    return diff >= 0 && diff < 7;
  }
  return dateStr.slice(0, 7) === CURRENT_DATE.slice(0, 7);
}
function commodityIsFerrous(code) { const c = findCommodity(code); return c ? !!c.ferrous : false; }
function volBucket(rows) { return { lbs: rows.reduce((s, t) => s + t.netWeight, 0), dollars: r2(rows.reduce((s, t) => s + t.total, 0)) }; }
function volumesForYard(yard, period) {
  const yardCodes = yard === "CORP" ? realYardCodes() : [yard];
  const rel = tickets.filter(t => yardCodes.includes(t.yard) && inPeriod(t.date, period) && t.kind !== "transfer");
  const ferrousBuy = volBucket(rel.filter(t => t.type === "buy" && commodityIsFerrous(t.commodity)));
  const ferrousSell = volBucket(rel.filter(t => t.type === "sell" && commodityIsFerrous(t.commodity)));
  const nfBuy = volBucket(rel.filter(t => t.type === "buy" && !commodityIsFerrous(t.commodity)));
  const nfSell = volBucket(rel.filter(t => t.type === "sell" && !commodityIsFerrous(t.commodity)));
  const freightRel = freightTickets.filter(f => { const t = tickets.find(x => x.id === f.ticketId); return t && yardCodes.includes(t.yard) && inPeriod(t.date, period); });
  const freightCost = r2(freightRel.reduce((s, f) => s + f.cost, 0));
  const xferOut = yardTransfers.filter(x => yardCodes.includes(x.fromYard) && !yardCodes.includes(x.toYard) && inPeriod(x.date, period));
  const xferIn = yardTransfers.filter(x => yardCodes.includes(x.toYard) && !yardCodes.includes(x.fromYard) && inPeriod(x.date, period));
  return {
    ferrousBuy, ferrousSell, nfBuy, nfSell,
    otherBuy: { lbs: 0, dollars: 0 }, otherSell: { lbs: 0, dollars: 0 }, // no commodity is flagged "Other/Converters" yet
    freightCost,
    xferOutLbs: xferOut.reduce((s, x) => s + x.netWeight, 0), xferOutDollars: r2(xferOut.reduce((s, x) => s + x.total, 0)),
    xferInLbs: xferIn.reduce((s, x) => s + x.netWeight, 0), xferInDollars: r2(xferIn.reduce((s, x) => s + x.total, 0)),
  };
}
function renderVolumesPanel(yard) {

  const nfRows = periods.map(p => {

    return `<tr><td>${labels[p]}</td>

  const xferRows = periods.map(p => {

        <tr><th></th><th class="num">Lbs</th><th class="num">Net Tons</th><th class="num">$</th><th class="num">Avg $/NT</th><th class="num">Lbs</th><th class="num">Net Tons</th><th class="num">$</th><th class="num">Avg $/NT</th></tr></thead>
        <tbody>${ferrousRows}</tbody></table></div>
      <div style="overflow-x:auto; margin-top:16px;"><table><thead><tr><th>Non-Ferrous</th><th class="num" colspan="3">Purchased</th><th class="num" colspan="3">Sold</th></tr>

        <tbody>${nfRows}</tbody></table></div>
      <div style="overflow-x:auto; margin-top:16px;"><table><thead><tr><th>Other / Converters</th><th class="num">Purchased $</th><th class="num">Sold $</th></tr></thead>
        <tbody>${otherRows}</tbody></table></div>

      <div class="grid2" style="margin-top:16px;">

          <tr><th></th><th class="num">Lb</th><th class="num">$ at transfer price</th><th class="num">Lb</th><th class="num">$ at transfer price</th></tr></thead>
          <tbody>${xferRows}</tbody></table>

        <div><table><thead><tr><th>Freight Cost</th><th class="num">$</th></tr></thead>
          <tbody>${freightRows}</tbody></table>

      </div>

// Modeled on a real Langer/ScrapDragon Packing List — grouped by material with per-material subtotals,
// mirroring the real document's bale-tag groupings. This prototype tracks one scale ticket per material
// rather than individual bale tags, so each material's rows are its ticket(s) rather than a tag-by-tag list.
function buildPackingListHtml(ticketId) {
  const shipment = resolveShipmentForTicket(ticketId);
  if (!shipment) return "";
  const stix = shipmentTickets(shipment);
  if (!stix.length) return "";
  const byMaterial = new Map();
  stix.forEach(t => { if (!byMaterial.has(t.commodity)) byMaterial.set(t.commodity, []); byMaterial.get(t.commodity).push(t); });
  const netTotal = r2(stix.reduce((s,t) => s + (isEachUnit(t.commodity) ? 0 : t.netWeight), 0));
  const materialBlocks = [...byMaterial.entries()].map(([code, list]) => {
    const subtotal = r2(list.reduce((s,t) => s + t.netWeight, 0));
    return `
      <tr class="gp-mathead-row"><td colspan="3">Material: ${commodityName(code)}</td></tr>
      ${list.map(t => `<tr><td>${t.id}</td><td>${commodityName(t.commodity)}</td><td class="num">${fmtQty(t.commodity, t.netWeight)}</td></tr>`).join("")}
      <tr class="gp-subtotal-row"><td colspan="2" style="text-align:right;">${commodityName(code)} Subtotal:</td><td class="num">${fmtQty(code, subtotal)}</td></tr>
    `;
  }).join("");
  return `
    <div class="print-doc" style="max-width:760px;">
      <div class="dochead"><img src="data:image/png;base64,${LANGER_LOGO_B64}" alt="Langer Industrial" /><h1>Packing List</h1></div>
      <div class="sub">${yardName(shipment.yard)} · ${shipment.date}</div>
      <table>
        <tr><th>Pack List #</th><td>${shipment.id}</td><th>Ship To</th><td>${shipment.party}</td></tr>
        ${shipment.bolNumber ? `<tr><th>B/L #</th><td colspan="3">${shipment.bolNumber}</td></tr>` : ""}
      </table>
      <table style="margin-top:10px;">
        <thead><tr><th>Ticket #</th><th>Material</th><th class="num">Net Weight / Qty</th></tr></thead>
        <tbody>${materialBlocks}</tbody>
        <tfoot><tr class="gp-grandtotal-row"><td colspan="2">Total Net Weight (all materials)</td><td class="num">${fmtQty(null, netTotal)}</td></tr></tfoot>
      </table>
      <div class="footnote" style="margin-top:8px;">Grouped by material, mirroring the real Packing List's bale-tag groupings — this prototype tracks one scale ticket per material line rather than individual bale tags, so each row here is a ticket instead of a tag.</div>
    </div>`;
}
function printPackingList(ticketId) {

  if (!html) return;
  document.getElementById("print-area").innerHTML = html;
  window.print();
}
// Modeled on a real Langer/ScrapDragon Bill of Lading — one B/L per shipment (truck/rail load), which
// may bundle several commodities since NF loads especially are typically mixed. Gross/Tare/Net are
// summed across the shipment's tickets; gross/tare are only captured from this feature forward, so
// older/legacy tickets (and each-unit commodities, which don't have a physical scale weight) fall back
// to showing Net only and are called out separately rather than folded into the weight totals.
function buildBillOfLadingHtml(ticketId) {
  const shipment = resolveShipmentForTicket(ticketId);
  if (!shipment) return "";
  const stix = shipmentTickets(shipment);
  if (!stix.length) return "";
  const weighable = stix.filter(t => t.gross != null && t.tare != null);
  const grossTotal = r2(weighable.reduce((s,t) => s + t.gross, 0));
  const tareTotal = r2(weighable.reduce((s,t) => s + t.tare, 0));
  const netTotal = r2(weighable.reduce((s,t) => s + t.netWeight, 0));
  const eachLines = stix.filter(t => isEachUnit(t.commodity));
  const fts = freightForTicket(stix[0].id);
  const carrier = fts.length && findCarrier(fts[0].carrierId) ? findCarrier(fts[0].carrierId) : null;
  const cust = shipment.partyId ? findCustomer(shipment.partyId) : null;
  const addressLine = cust && cust.address ? cust.address.replace(/\n/g, ", ") : "";
  return `
    <div class="print-doc" style="max-width:760px;">
      <div class="dochead"><img src="data:image/png;base64,${LANGER_LOGO_B64}" alt="Langer Industrial" /><h1>Bill of Lading</h1></div>
      <div class="sub">${yardName(shipment.yard)} · ${shipment.date}</div>
      <table>
        <tr><th>B/L #</th><td>${shipment.bolNumber || shipment.id}</td><th>Ship Date</th><td>${shipment.date}</td></tr>
        <tr><th>Ship From</th><td>${yardAddressLine(shipment.yard)}</td><th>Carrier</th><td>${carrier ? carrier.name : "—"}</td></tr>
        <tr><th>Ship To</th><td colspan="3">${shipment.party}${addressLine ? " — " + addressLine : ""}</td></tr>
      </table>
      <table style="margin-top:10px;">
        <thead><tr><th>Material</th><th class="num">Packages</th><th class="num">Gross (lb)</th><th class="num">Tare (lb)</th><th class="num">Net Weight</th></tr></thead>
        <tbody>${stix.map(t => `<tr><td>${commodityName(t.commodity)}</td><td class="num">1</td><td class="num">${t.gross != null ? fmtQty(t.commodity, t.gross) : "—"}</td><td class="num">${t.tare != null ? fmtQty(t.commodity, t.tare) : "—"}</td><td class="num">${fmtQty(t.commodity, t.netWeight)}</td></tr>`).join("")}</tbody>
        <tfoot><tr style="font-weight:700;"><td>Total (${stix.length} line${stix.length===1?"":"s"})</td><td class="num">${stix.length}</td><td class="num">${weighable.length ? fmtQty(null, grossTotal) : "—"}</td><td class="num">${weighable.length ? fmtQty(null, tareTotal) : "—"}</td><td class="num">${weighable.length ? fmtQty(null, netTotal) : "—"}</td></tr></tfoot>
      </table>
      <div class="footnote" style="margin-top:8px;">${eachLines.length ? `Plus ${eachLines.map(t => fmtQty(t.commodity, t.netWeight) + " " + commodityName(t.commodity)).join(", ")}, not physically weighed so not included in the totals above. ` : ""}See Packing List ${shipment.id} for the material-by-material breakdown. "Packages" reflects one scale ticket per material — this prototype doesn't track individual bale/pallet tag counts.</div>
    </div>`;
}
function printBillOfLading(ticketId) {
  const html = buildBillOfLadingHtml(ticketId);
  if (!html) return;
  document.getElementById("print-area").innerHTML = html;
  window.print();
}
// Badges a ticket's id with its Shipment # when it's one of several materials grouped into a mixed
// load — a lone-material shipment (the common ferrous case) shows no badge at all.
function shipmentBadgeHtml(t) {
  let html = "";
  if (t.shipmentId) {
    const s = findShipment(t.shipmentId);
    if (s && s.ticketIds.length > 1) html += ` <span class="badge tier-scale" title="Part of mixed-load shipment ${s.id} (${s.ticketIds.length} materials)">${s.id}</span>`;
  }
  if (t.packId) html += ` <span class="badge tier-scale" title="Shipped from a pre-weighed, scanned pack">${t.packId}</span>`;
  return html;
}

        </div>
      </div>
    </div>
  `;
}
// Live-filters the Seller/Dealer or Buyer/Customer dropdown as the user types — the select stays the
// real data source (same onchange, same "+ Add new" / "Walk-in" sentinels), this just hides options
// whose name or phone don't match, so picking one out of a long dealer/customer list doesn't mean
// scrolling through all of them.
function filterPartyOptions(prefix) {
  const input = document.getElementById(`${prefix}-party-search`);
  const select = document.getElementById(`${prefix}-party-select`);
  if (!input || !select) return;
  const q = input.value.trim().toLowerCase();
  Array.from(select.options).forEach(opt => {
    if (opt.value === "" || opt.value === "__new__") { opt.hidden = false; return; }
    const haystack = opt.dataset.search || opt.textContent.toLowerCase();
    opt.hidden = q.length > 0 && !haystack.includes(q);
  });
}
function onPartyPick(kind, prefix) {
  const val = document.getElementById(`${prefix}-party-select`).value;
  selectedPartyByPrefix[prefix] = val;
  document.getElementById(`${prefix}-newparty`).style.display = val === "__new__" ? "block" : "none";
  const holdWrap = document.getElementById(`${prefix}-holddesc-wrap`);
  if (holdWrap) holdWrap.style.display = val === "" ? "block" : "none";
  if (val !== "") holdDescByPrefix[prefix] = ""; // party identified — clear any stand-in description
  if (prefix === "kiosk") renderKioskButtons();
}
async function saveNewParty(kind, prefix) {
  const name = document.getElementById(`${prefix}-np-name`).value.trim();
  if (!name) { alert("Name is required."); return; }
  const phone = document.getElementById(`${prefix}-np-phone`).value.trim();
  let id;
  try {
    if (kind === "vendor") {
      const tier = document.getElementById(`${prefix}-np-tier`).value;
      id = (await createParty("vendor", { name, phone, tier })).id;
    } else {
      id = (await createParty("customer", { name, phone })).id;
    }
  } catch (err) {
    alert("Couldn't save: " + err.message);
    return;
  }
  render(); // full re-render rebuilds the select with the new record
  requestAnimationFrame(() => { const sel = document.getElementById(`${prefix}-party-select`); if (sel) { sel.value = id; onPartyPick(kind, prefix); } });
}
function getSelectedParty(kind, prefix) {
  const val = document.getElementById(`${prefix}-party-select`)?.value;
  if (!val || val === "__new__") return null;
  return kind === "vendor" ? findVendor(val) : findCustomer(val);
}

let kioskButtons = [];

(function seedKioskButtons() {
  const cats = [...new Set(commodities.filter(c => c.kiosk.show).map(c => c.category))];

let pendingWeighInId = null;

function recalcPendingWeighIn() {
  const t = tickets.find(x => x.id === pendingWeighInId);
  if (!t) return;
  const code = document.getElementById("pw-commodity").value;
  const vendor = findVendor(t.partyId);
  const tier = vendor ? vendor.tier : "scale";
  const price = code ? tierPrice(code, t.yard, tier) : 0;
  const gross = parseFloat(document.getElementById("pw-gross").value) || 0;
  const tare = parseFloat(document.getElementById("pw-tare").value) || 0;
  const net = Math.max(0, gross - tare);
  document.getElementById("pw-net").value = net;
  const grossValue = net * price;
  const chargeback = Math.min(t.chargebackAmount || 0, grossValue);
  document.getElementById("pw-grossline").textContent = fmtMoney(grossValue);
  document.getElementById("pw-payout").textContent = fmtMoney(Math.max(0, grossValue - chargeback));
}
function completePendingWeighIn() {
  const t = tickets.find(x => x.id === pendingWeighInId);
  if (!t) return;
  const code = document.getElementById("pw-commodity").value;
  const c = findCommodity(code);
  if (!c) { alert("Pick the commodity that was collected."); return; }
  const vendor = findVendor(t.partyId);
  const tier = vendor ? vendor.tier : "scale";
  const price = tierPrice(c.code, t.yard, tier);
  const gross = parseFloat(document.getElementById("pw-gross").value) || 0;
  const tare = parseFloat(document.getElementById("pw-tare").value) || 0;
  const net = Math.max(0, gross - tare);
  if (net <= 0) { alert("Net weight must be greater than zero."); return; }
  const grossValue = r2(net * price);
  const chargeback = r2(Math.min(t.chargebackAmount || 0, grossValue));
  t.commodity = c.code;
  t.tier = tier;
  t.netWeight = net;
  t.price = price;
  t.chargebackAmount = chargeback;
  t.total = r2(grossValue - chargeback);
  t.status = "Held";
  // Inventory still books in at the full material price — the chargeback only reduces what's paid out,
  // it isn't a discount on the material itself.
  applyInventoryBuy(t.yard, c.code, net, price, t.id);
  pendingWeighInId = null;
  render();
}

/* Check Register — one per yard's bank account (see bankAccounts above). Every non-voided check
   drawn on this account reduces the running/book balance the moment it's issued (checkNumber
   assigned); it stays "Outstanding" until you Mark cleared once it actually shows up on the bank
   statement, at which point it also comes out of the Cleared balance — the two balances are exactly
   what you'd reconcile against a paper statement each month. */
function checkRegisterRows(yard) {
  const acct = findBankAccount(yard);
  const startingBalance = acct ? acct.startingBalance : 0;
  const checks = remittances.filter(r => r.method === "Check" && (r.account || "SB") === yard);
  let running = startingBalance;
  const rows = checks.map(r => {
    if (!r.voided) running = r2(running - r.total);
    return { r, balance: running };
  });
  const registerBalance = running;
  const clearedBalance = r2(startingBalance - checks.filter(c => !c.voided && c.cleared).reduce((s, c) => s + c.total, 0));
  const outstanding = checks.filter(c => !c.voided && !c.cleared);
  const outstandingTotal = r2(outstanding.reduce((s, c) => s + c.total, 0));
  return { startingBalance, rows: rows.slice().reverse(), registerBalance, clearedBalance, outstandingTotal, outstandingCount: outstanding.length };
}

  if (r.cleared) return `<span class="badge completed">Cleared ${r.clearedDate || ""}</span>`;
  return `<span class="badge in_progress">Outstanding</span>`;
}

  if (r.voided || !r.checkPrinted) return base;

function viewCashierAgedPayables() {
  const rows = yardAgedPayables(currentYard);
  const totals = AGING_BUCKETS.reduce((acc,b) => { acc[b.key] = rows.reduce((s,r) => s + r[b.key], 0); return acc; }, {});
  const grandTotal = rows.reduce((s,r) => s + r.total, 0);
  const pastDue = totals.b61_90 + totals.b90_plus;
  function cell(r, key) {
    const val = r[key];
    if (val <= 0) return `<td class="num">—</td>`;
    const style = key === "b90_plus" ? "color:var(--critical); font-weight:700;" : key === "b61_90" ? "color:var(--warning); font-weight:600;" : "";

      </div>

      <table>
        <thead><tr><th>Vendor / Carrier</th>${AGING_BUCKETS.map(b => `<th class="num">${b.label}</th>`).join("")}<th class="num">Total owed</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${r.payee}</td>${AGING_BUCKETS.map(b => cell(r, b.key)).join("")}<td class="num" style="font-weight:700;">${fmtMoney0(r.total)}</td></tr>`).join("")}</tbody>
        <tfoot><tr style="font-weight:700;"><td>Total</td>${AGING_BUCKETS.map(b => `<td class="num">${fmtMoney0(totals[b.key])}</td>`).join("")}<td class="num">${fmtMoney0(grandTotal)}</td></tr></tfoot>
      </table>` : `<div class="empty">Nothing open at ${yardName(currentYard)} right now.</div>`}
    </div>
  `;
}

let shipmentCart = [];
// Packs already weighed and pulled out of raw inventory (see Inventory → Packs), sitting at this yard,
// not yet shipped — the candidates a scale operator can scan (or click here) into a shipment.
function readyPacksForScan(yard) { return availablePacks(yard); }
function findPack(id) { return packs.find(p => p.id === id); }
// A pack's QR label just encodes its own Pack # (see printPackLabel) — scanning or typing that value
// here looks it up and drops it straight into the shipment cart at its frozen commodity/quantity, no
// re-weighing. The pack's inventory already left the books when it was packed, so it does NOT get
// counted against on-hand again at shipment time (see submitTicket) — only the sale itself is new.
function scanPackIntoShipment() {
  const input = document.getElementById("tf-scan-pack");
  const raw = input.value.trim();
  if (!raw) return;
  const id = raw.toUpperCase();
  const p = packs.find(x => x.id.toUpperCase() === id);
  if (!p) { alert(`No pack found for "${raw}" — check the label and try again.`); input.value = ""; input.focus(); return; }
  if (p.yard !== currentYard) { alert(`Pack ${p.id} was packed at ${yardName(p.yard)}, not ${yardName(currentYard)} — switch yards to ship it from there.`); input.value = ""; return; }
  if (p.status === "Sold") { alert(`Pack ${p.id} already shipped on ticket ${p.ticketId || "—"} — it can't be added again.`); input.value = ""; return; }
  if (p.status === "Unpacked") { alert(`Pack ${p.id} was unpacked back into raw inventory — enter that material manually instead of scanning this label.`); input.value = ""; return; }
  if (!p.moved) { alert(`Pack ${p.id} hasn't had its inventory moved out of on-hand yet — finish that from Inventory → Packs before shipping it.`); input.value = ""; return; }
  if (shipmentCart.some(l => l.packId === p.id)) { alert(`Pack ${p.id} is already queued in this shipment's cart.`); input.value = ""; return; }
  const price = masterPriceAtYard(p.commodity, currentYard);
  const contractEl = document.getElementById("f-contract");
  const contractId = contractEl ? (contractEl.value || null) : null;
  shipmentCart.push({ commodity: p.commodity, netWeight: p.qty, gross: null, tare: null, price, total: r2(p.qty * price), contractId, packId: p.id, packCostPerUnit: p.costPerUnit });
  render();
  requestAnimationFrame(() => { const el = document.getElementById("tf-scan-pack"); if (el) el.focus(); }); // stays focused for rapid back-to-back scans
}
function addShipmentLine() {
  const commodity = document.getElementById("f-commodity").value;
  const net = parseFloat(document.getElementById("f-net").value) || 0;
  if (net <= 0) { alert(isEachUnit(commodity) ? "Quantity must be greater than zero." : "Net weight must be greater than zero."); return; }
  const each = isEachUnit(commodity);
  const gross = each ? null : (parseFloat(document.getElementById("f-gross").value) || 0);
  const tare = each ? null : (parseFloat(document.getElementById("f-tare").value) || 0);
  const displayPrice = parseFloat(document.getElementById("f-price").value) || 0;
  const price = fromDisplayRate(commodity, displayPrice);
  const contractEl = document.getElementById("f-contract");
  const contractId = contractEl ? (contractEl.value || null) : null;
  shipmentCart.push({ commodity, netWeight: net, gross, tare, price, total: r2(net * price), contractId });
  render();
}
function removeShipmentLine(idx) { shipmentCart.splice(idx, 1); render(); }
function renderShipmentCartHtml() {
  if (!shipmentCart.length) return `<div class="empty">No materials queued yet — fill in one above and click "+ Add material," or just leave it here and click Complete Shipment for a single-material sale.</div>`;
  return shipmentCart.map((l, i) => `
    <div class="cart-line">
      <div><div class="cname">${commodityName(l.commodity)}${l.packId ? ` <span class="badge tier-scale" title="Scanned from pack ${l.packId} — already weighed/moved, won't touch on-hand again">${l.packId}</span>` : ""}</div><div class="cmeta">${fmtQty(l.commodity,l.netWeight)} × ${fmtRate(l.commodity,l.price)}${l.contractId ? " · " + l.contractId : ""}</div></div>
      <div style="display:flex; align-items:center; gap:8px;"><b>${fmtMoney(l.total)}</b><button class="btn ghost" onclick="removeShipmentLine(${i})">✕</button></div>
    </div>`).join("");
}
function applyLaneToTicketForm() {
  const laneId = document.getElementById("tf-freight-lane").value;
  if (!laneId) return;
  const lane = findLane(laneId);
  document.getElementById("tf-freight-origin").value = lane.origin;
  document.getElementById("tf-freight-dest").value = lane.destination;
  if (lane.carrierId) document.getElementById("tf-freight-carrier").value = lane.carrierId;

function currentTicketPrice(type) {
  const code = document.getElementById("f-commodity").value;
  // Sell tickets price at our master (sale) price — no dealer tier involved, that's what we're paid, not what we pay.
  if (type === "sell") return { price: masterPriceAtYard(code, currentYard), tier: null };
  const party = getSelectedParty("vendor", 'tf');
  const tier = party ? party.tier : "scale";
  return { price: tierPrice(code, currentYard, tier), tier };
}
function updateTicketPrice(type) {
  const code = document.getElementById("f-commodity").value;
  const { price } = currentTicketPrice(type); // real $/lb (or $/EA for each-unit commodities)
  document.getElementById("f-price").value = r3(displayRate(code, price));
  const label = document.getElementById("f-price-label");
  if (label) label.textContent = `Price ${unitShortLabel(code)}`;
  const each = isEachUnit(code);
  const wf = document.getElementById("tf-weight-fields");
  const qf = document.getElementById("tf-qty-fields");
  if (wf) wf.style.display = each ? "none" : "contents";
  if (qf) qf.style.display = each ? "contents" : "none";
  const netLabel = document.getElementById("f-net-label");
  if (netLabel) netLabel.textContent = each ? "Quantity (EA)" : "Net weight (lb)";
  recalcTicket();
}
function recalcTicket() {
  const code = document.getElementById("f-commodity").value;
  let net;
  if (isEachUnit(code)) {
    net = parseFloat(document.getElementById("f-qty").value) || 0;
  } else {
    const gross = parseFloat(document.getElementById("f-gross").value) || 0;
    const tare = parseFloat(document.getElementById("f-tare").value) || 0;
    net = Math.max(0, gross - tare);
  }
  document.getElementById("f-net").value = net;
  const displayPrice = parseFloat(document.getElementById("f-price").value) || 0;
  const perLb = fromDisplayRate(code, displayPrice);
  document.getElementById("f-total").textContent = fmtMoney(net * perLb);
}
async function submitTicket(type) {
  if (type === "buy") {
    const party = getSelectedParty("vendor", 'tf');
    const partyName = party ? party.name : "Walk-in";
    const partyId = party ? party.id : null;
    const holdDescription = partyId ? null : ((holdDescByPrefix['tf'] || "").trim() || null);
    const commodity = document.getElementById("f-commodity").value;
    const net = parseFloat(document.getElementById("f-net").value) || 0;
    const displayPrice = parseFloat(document.getElementById("f-price").value) || 0;
    const price = fromDisplayRate(commodity, displayPrice); // canonical $/lb — what's actually stored/used everywhere downstream
    const payment = document.getElementById("f-payment").value;
    const compliance = document.getElementById("f-compliance").value;
    if (net <= 0) { alert(isEachUnit(commodity) ? "Quantity must be greater than zero." : "Net weight must be greater than zero."); return; }
    if (compliance === "no") { alert("Ticket flagged: compliance not verified. In a full build this would route to a manager-review queue instead of blocking the yard."); }
    const tier = party ? party.tier : "scale";
    try {
      const apiTicket = await apiFetch("/tickets", {
        method: "POST",
        body: JSON.stringify({ type: "buy", date: CURRENT_DATE, yard: currentYard, vendorId: partyId, partyName: holdDescription || partyName, commodity, tier, netWeight: net, price, payment }),
      });
      tickets.unshift(mapApiTicket(apiTicket));
      await refreshInventoryFor(currentYard, [commodity]);
      attachFreightFromTicketForm(apiTicket.id);
      currentRoute = "purchasing";
    } catch (err) {
      alert("Couldn't post to the live backend: " + err.message);
    } finally {
      render();
    }
    return;
  }
  // ---- sell: one Shipment record + one ticket per queued material — mixed NF loads are typically
  // several materials on one shipment, so the current line editor is just "the next material to add."
  // The Shipment wrapper itself stays local-only (the backend has no /shipments route yet) — each
  // individual ticket is still posted for real.
  const party = getSelectedParty("customer", 'tf');
  const partyName = party ? party.name : "Walk-in";
  const partyId = party ? party.id : null;
  const holdDescription = partyId ? null : ((holdDescByPrefix['tf'] || "").trim() || null);
  const payment = document.getElementById("f-payment").value;
  const compliance = document.getElementById("f-compliance").value;
  // Auto-add whatever's currently filled into the line editor, so a single-material sale (still the
  // common case for ferrous) takes the same one-click flow it always has — no separate "+ Add" click required.
  const commodity = document.getElementById("f-commodity").value;
  const net = parseFloat(document.getElementById("f-net").value) || 0;
  if (net > 0) {
    const each = isEachUnit(commodity);
    const gross = each ? null : (parseFloat(document.getElementById("f-gross").value) || 0);
    const tare = each ? null : (parseFloat(document.getElementById("f-tare").value) || 0);
    const displayPrice = parseFloat(document.getElementById("f-price").value) || 0;
    const price = fromDisplayRate(commodity, displayPrice);
    const contractEl = document.getElementById("f-contract");
    const contractId = contractEl ? (contractEl.value || null) : null;
    shipmentCart.push({ commodity, netWeight: net, gross, tare, price, total: r2(net * price), contractId });
  }
  if (!shipmentCart.length) { alert(isEachUnit(commodity) ? "Quantity must be greater than zero." : "Net weight must be greater than zero."); return; }
  if (compliance === "no") { alert("Ticket flagged: compliance not verified. In a full build this would route to a manager-review queue instead of blocking the yard."); }
  const bolNumber = (document.getElementById("tf-bol-number")?.value || "").trim() || null;
  const shipmentId = "SHP-" + (shipmentSeq++);
  const newTicketIds = [];
  const lines = shipmentCart.slice();
  shipmentCart = [];
  try {
    for (const line of lines) {
      // Terms/due date are still computed locally for display; the backend doesn't track terms yet.
      const terms = effectiveTerms(line.contractId, partyId);
      const dueDate = addDays(CURRENT_DATE, TERMS_DAYS[terms] || 0);
      const apiTicket = await apiFetch("/tickets", {
        method: "POST",
        body: JSON.stringify({ type: "sell", date: CURRENT_DATE, yard: currentYard, customerId: partyId, partyName: holdDescription || partyName, commodity: line.commodity, netWeight: line.netWeight, price: line.price, payment }),
      });
      const t = mapApiTicket(apiTicket);
      t.gross = line.gross; t.tare = line.tare; t.terms = terms; t.dueDate = dueDate; t.shipmentId = shipmentId;
      tickets.unshift(t);
      if (line.packId) {
        const p = findPack(line.packId);
        if (p) { p.status = "Sold"; p.ticketId = apiTicket.id; p.shipmentId = shipmentId; }
      }
      if (line.contractId) applyContractShipment(line.contractId, line.netWeight); // local-only contract tracking for now
      newTicketIds.push(apiTicket.id);
    }
    await refreshInventoryFor(currentYard, [...new Set(lines.map(l => l.commodity))]);
    shipments.push({ id: shipmentId, yard: currentYard, date: CURRENT_DATE, partyId, party: partyName, bolNumber, notes: "", ticketIds: newTicketIds });
    attachFreightFromTicketForm(newTicketIds[0], newTicketIds.slice(1));
    currentRoute = "sales";
  } catch (err) {
    alert("Couldn't post to the live backend: " + err.message);
    shipmentCart = lines; // put the cart back so nothing's lost
  } finally {
    render();
  }
}
function applyContractShipment(contractId, netWeight) {
  const c = findContract(contractId);
  if (!c) return;
  c.shippedQty = r2(c.shippedQty + netWeight);
}
function attachFreightFromTicketForm(primaryTicketId, otherTicketIds = []) {
  const carrierId = document.getElementById("tf-freight-carrier").value || null;
  const placeholder = document.getElementById("tf-freight-placeholder").checked;
  const costInput = parseFloat(document.getElementById("tf-freight-cost").value) || 0;
  if (!carrierId && !placeholder && costInput <= 0) return; // no freight info entered — skip
  const laneId = document.getElementById("tf-freight-lane").value || null;
  const origin = document.getElementById("tf-freight-origin").value.trim() || (laneId ? findLane(laneId).origin : "TBD");
  const destination = document.getElementById("tf-freight-dest").value.trim() || (laneId ? findLane(laneId).destination : "TBD");
  const cost = placeholder ? 0.01 : costInput;
  const notes = otherTicketIds.length ? `Covers same load as: ${otherTicketIds.join(", ")}` : "";
  createFreightTicket({ ticketId: primaryTicketId, carrierId, laneId, origin, destination, cost, placeholder, notes });
}

function exportCommodityCsv() {
  const rows = [["Category","Code","Name","Unit","LowThreshold","MasterPrice"]];
  commodities.forEach(c => { rows.push([c.category, c.code, c.name, commodityUnit(c.code), c.lowThreshold, c.masterPrice]); });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "langer_commodities.csv"; a.click();
  URL.revokeObjectURL(url);
}
function handleCsvFile(evt) {
  const file = evt.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { importCommodityCsv(reader.result); evt.target.value = ""; };
  reader.readAsText(file);
}
function parseCsvLine(line) {
  const out = []; let cur = ""; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) { if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') { inQ = false; } else cur += ch; }
    else { if (ch === '"') inQ = true; else if (ch === ",") { out.push(cur); cur = ""; } else cur += ch; }
  }
  out.push(cur); return out;
}
function importCommodityCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return;
  const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const idx = (name) => header.indexOf(name);
  let created = 0, updated = 0;
  for (let i = 1; i < lines.length; i++) {
    const row = parseCsvLine(lines[i]);
    const category = row[idx("category")]?.trim() || "Aluminum";
    const code = row[idx("code")]?.trim().toUpperCase();
    const name = row[idx("name")]?.trim();
    const lowThreshold = parseFloat(row[idx("lowthreshold")]) || 500;
    const masterPrice = parseFloat(row[idx("masterprice")]) || 0;
    const unitRaw = idx("unit") >= 0 ? row[idx("unit")]?.trim() : "";
    const unit = UNITS[unitRaw] ? unitRaw : (category === "Ferrous" ? "net_ton" : "lb"); // falls back to the category default if the column is missing/unrecognized
    if (!code || !name) continue;
    let c = findCommodity(code);
    if (!c) {
      c = { code, name, category, ferrous: category === "Ferrous", unit, lowThreshold, kiosk: { show: false, color: "series-1" }, masterPrice };
      commodities.push(c);
      YARDS.forEach(y => { if (!(code in inventoryByYard[y.code])) inventoryByYard[y.code][code] = { qty: 0, avgCost: 0 }; });
      created++;
    } else { c.masterPrice = masterPrice; c.lowThreshold = lowThreshold; c.category = category; if (idx("unit") >= 0 && UNITS[unitRaw]) c.unit = unitRaw; updated++; }
  }
  alert(`Import complete: ${created} new commodity row(s) created, ${updated} existing row(s) updated with new master pricing.`);
  render();
}

function exportInventoryLedgerCsv() {
  const corp = isCorp();
  const rows = inventoryLedger
    .filter(l => corp || l.yard === currentYard)
    .filter(l => ledgerCommodityFilter === "All" || l.code === ledgerCommodityFilter)
    .filter(l => ledgerPeriod === "all" || inPeriod(l.date, "monthly"));
  const header = ["Date","Time","Yard","Commodity","Type","QtyChange","UnitPrice","Balance","AvgCost","CashCost","Ref"];
  const csvRows = [header];
  rows.forEach(l => csvRows.push([l.date, l.time || "", l.yard, commodityName(l.code), LEDGER_TYPE_LABEL[l.type] || l.type, l.qtyChange, l.unitPrice != null ? l.unitPrice : "", l.balanceQty, l.avgCost, l.cashCost, l.ref]));
  const csv = csvRows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const scope = ledgerCommodityFilter === "All" ? "all_items" : ledgerCommodityFilter;
  const a = document.createElement("a"); a.href = url; a.download = `langer_inventory_ledger_${currentYard}_${scope}_${ledgerPeriod}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- Inventory > Inventory Moves — log of inventory moved out of on-hand stock for a specific purpose ---------------- */
let inventoryMoves = [];
let moveSeq = 1;
function logInventoryMove(yard, code, qty, type, ref, notes) {
  const id = "MV-" + (moveSeq++);
  inventoryMoves.push({ id, date: CURRENT_DATE, yard, code, qty, type, ref, notes: notes || "" });
  return id;
}
let conversionSeq = 1;
function convertInventory() {
  if (!can('regradeInventory')) { alert("You don't have access to regrade inventory."); return; }
  const fromCode = document.getElementById("mv-from-code").value;
  const toCode = document.getElementById("mv-to-code").value;
  const fromQty = parseFloat(document.getElementById("mv-from-qty").value) || 0;
  const toQty = parseFloat(document.getElementById("mv-to-qty").value) || 0;
  const reason = document.getElementById("mv-reason").value.trim();
  if (fromCode === toCode) { alert("Pick two different commodities — converting a commodity into itself isn't a regrade."); return; }
  if (fromQty <= 0 || toQty <= 0) { alert("Enter a quantity greater than zero on both sides."); return; }
  if (!reason) { alert("Enter a reason for the regrade (e.g. contamination found on inspection, stripped for bare bright yield)."); return; }
  if (toQty > fromQty) { alert(`A regrade can't come out heavier than it went in — processing only loses weight (trim, contamination, moisture), it never adds any. You entered ${fmtQty(fromCode, fromQty)} in and ${fmtQty(toCode, toQty)} out; lower the "To quantity" to ${fmtQty(fromCode, fromQty)} or less.`); return; }
  const onHand = getInventoryQty(currentYard, fromCode);
  if (fromQty > onHand) { alert(`Only ${fmtQty(fromCode, onHand)} of ${commodityName(fromCode)} on hand at ${yardName(currentYard)} — can't convert more than that.`); return; }
  const ref = "CONV-" + (conversionSeq++);
  applyInventoryConversion(currentYard, fromCode, fromQty, toCode, toQty, `${reason} (${ref})`);
  logInventoryMove(currentYard, fromCode, -fromQty, "Regrade", ref, `${reason} → ${commodityName(toCode)}`);
  logInventoryMove(currentYard, toCode, toQty, "Regrade", ref, `${reason} ← ${commodityName(fromCode)}`);
  render();
}
function mvAvailabilityHtml(code, neededQty) {
  if (!code) return "Pick a From commodity to see what's on hand.";
  const onHand = getInventoryQty(currentYard, code);
  if (neededQty > onHand) {
    return `<span style="color:var(--critical); font-weight:700;">Only ${fmtQty(code, onHand)} of ${commodityName(code)} on hand — short ${fmtQty(code, Math.round((neededQty - onHand) * 10) / 10)} to hit this in one move.</span>`;
  }
  return `${fmtQty(code, onHand)} of ${commodityName(code)} on hand — enough to cover this move.`;
}
function updateMvQtyLabels() {

  const tl = document.getElementById("mv-to-qty-label"); if (tl) tl.textContent = `To quantity — finished goods needed (${qtyUnitLabel(toCode)})`;
}
function mvUpdateAvailability() {

// Bidirectional calculator: typing the finished-goods (To) amount back-solves how much raw (From) material to pull,
// using the estimated yield %; typing From forward-solves the resulting To amount. Changing the yield re-solves From
// from whatever's currently in To, since the usual workflow is "I know the shipment target, how much do I need to pull".
function mvRecalc(source) {
  const yieldPct = Math.min(100, Math.max(1, parseFloat(document.getElementById("mv-yield").value) || 100)) / 100;
  const fromEl = document.getElementById("mv-from-qty");
  const toEl = document.getElementById("mv-to-qty");
  if (source === "from") {
    const fromQty = parseFloat(fromEl.value) || 0;
    toEl.value = Math.round(fromQty * yieldPct * 10) / 10;
  } else {
    const toQty = parseFloat(toEl.value) || 0;
    fromEl.value = yieldPct > 0 ? Math.round((toQty / yieldPct) * 10) / 10 : 0;
  }
  mvUpdateAvailability();
}
