// Ready-to-ship: the material already left raw on-hand when it was packed, and it hasn't shipped
// (or been unpacked back to raw) since. Pass "CORP" for the company-wide rollup.
function availablePacks(yard) {
  const corp = yard === "CORP";
  return packs.filter(p => (corp || p.yard === yard) && p.moved && p.status === "Open");
}

/* ---------------- Inventory > Packs — create, see what's ready to ship, and check it against contracts.
   Andy asked to fold "Packs" and "Available Packs" into one page: Create a pack, then Available Packs
   right below it, then Contract Status vs. Inventory underneath that — one place to both make a pack and
   see whether what's ready to ship covers what customers are actually waiting on. ---------------- */
let packs = [];
let packSeq = 1001;
function viewInventoryPacks() {
  const corp = isCorp();

    </table>` : `<div class="empty">No packed inventory available right now${corp ? "" : " at " + yn}.</div>`;
  const detailRows = avail.slice().reverse();
  return `
    <div class="subtitle">Pack finished goods (e.g. a pallet of rims) out of on-hand inventory and print a QR-coded label for it. Scan that label from Shipment / Contracts → Enter Sale / Shipment to add it straight to a shipment — no re-weighing needed.</div>

      <div class="form-grid cols4">

function updatePackQtyLabel() {
  const code = document.getElementById("pack-code").value;
  const label = document.getElementById("pack-qty-label");
  if (label) label.textContent = `Quantity to pack (${qtyUnitLabel(code)})`;
}
function createPack() {
  if (!can('packInventory')) { alert("You don't have access to pack/unpack inventory."); return; }
  const code = document.getElementById("pack-code").value;
  const qty = parseFloat(document.getElementById("pack-qty").value) || 0;
  const notes = document.getElementById("pack-notes").value.trim();
  if (qty <= 0) { alert("Enter a quantity to pack."); return; }
  const onHand = getInventoryQty(currentYard, code);
  if (qty > onHand) { alert(`Only ${fmtQty(code, onHand)} of ${commodityName(code)} on hand at ${yardName(currentYard)} — can't pack more than that.`); return; }
  const id = "PK-" + (packSeq++);
  // Freeze the cost basis right now, while the material is still valued at this yard's current average
  // cost — once it's shipped (see scanPackIntoShipment/submitTicket), COGS uses this frozen figure
  // rather than whatever the average cost of the remaining raw pile happens to be by then.
  const costPerUnit = getInventoryAvgCost(currentYard, code);
  const moveIt = confirm(`Move ${fmtQty(code, qty)} of ${commodityName(code)} out of on-hand inventory to create pack ${id}?\n\nChoose Cancel to create the pack label without moving inventory yet.`);
  let moveId = null;
  if (moveIt) {
    applyInventoryAdjustment(currentYard, code, -qty, `Packed into ${id}`, CURRENT_DATE, true, "Pack");
    moveId = logInventoryMove(currentYard, code, -qty, "Pack", id, notes);
  }
  packs.push({ id, yard: currentYard, date: CURRENT_DATE, commodity: code, qty, notes, moved: moveIt, moveId, status: "Open", costPerUnit, shipmentId: null, ticketId: null });
  render();
  printPackLabel(id);
}
// Reverses a pack that moved inventory out: returns the same quantity, at the same commodity, back to
// on-hand. This is a pure move (same as packing itself) — no value or quantity is created — so it's
// gated by the same "packInventory" permission as packing, not "adjustInventory".
function unpackPack(id) {
  if (!can('packInventory')) { alert("You don't have access to pack/unpack inventory."); return; }
  const p = packs.find(x => x.id === id);
  if (!p) return;
  if (!p.moved) { alert("This pack never moved inventory out, so there's nothing to unpack — it's just a label."); return; }
  if (p.status === "Sold") { alert("This pack has already been sold/shipped — it can't be unpacked."); return; }
  if (!confirm(`Unpack ${p.id} and return ${fmtQty(p.commodity, p.qty)} of ${commodityName(p.commodity)} to on-hand inventory at ${yardName(p.yard)}?`)) return;
  applyInventoryAdjustment(p.yard, p.commodity, p.qty, `Unpacked from ${p.id}`, CURRENT_DATE, true, "Unpack");
  logInventoryMove(p.yard, p.commodity, p.qty, "Unpack", p.id, p.notes);
  p.moved = false;
  p.status = "Unpacked";
  render();
}
function printPackLabel(id) {
  const p = packs.find(x => x.id === id);
  if (!p) return;
  let qrSvg = "";
  try {
    const qr = qrcode(0, "M");
    qr.addData(p.id);
    qr.make();
    qrSvg = qr.createSvgTag(4, 0);
  } catch (e) { qrSvg = `<div style="font-size:11px;color:#900;">QR code unavailable (offline).</div>`; }
  document.getElementById("print-area").innerHTML = `
    <div class="print-doc pack-label">
      <img src="data:image/png;base64,${LANGER_LOGO_B64}" alt="Langer Industrial" style="height:32px; margin-bottom:4px;" />
      <h1>Pack Label</h1>
      <div class="packid">${p.id}</div>
      <div class="qr-wrap">${qrSvg}</div>
      <div class="packmeta">
        <div><b>Commodity:</b> ${commodityName(p.commodity)}</div>
        <div><b>Quantity:</b> ${fmtQty(p.commodity, p.qty)}</div>
        <div><b>Yard:</b> ${yardName(p.yard)}</div>
        <div><b>Date:</b> ${p.date}</div>
        ${p.notes ? `<div><b>Notes:</b> ${p.notes}</div>` : ""}
      </div>
    </div>`;
  window.print();
}

/* ---------------- Box Rent (container/dispatch box billing) ----------------
   Rule (per Andy, Sept 24-25 2026 — matches the live "Langer Boxes" app): businesses are never charged for
   a box sitting on their site. Individuals get the first 7 days free; after that, $125/week posts in
   arrears at the end of each completed week WHILE THE BOX IS STILL ON SITE — day 14 owes $125, day 21 owes
   $250, and so on (nothing posts mid-week; day 8-13 is accruing but not yet due). If the box is picked up
   before a week completes, the trailing partial week is prorated at the daily rate ($125/7) instead of
   waiting for/rounding to a full week that will never happen — see freezeBoxRentOnPickup(). Only a box
   that's actually at_customer (or that WAS and has since been picked up) accrues/owes rent — one sitting at
   the yard, or one that was never placed at a customer, isn't on the clock.
   "Mark billed" and "Waive" both snapshot the days/amount at that moment (for the invoice or for reporting
   what was forgiven) without resetting the underlying placement date — unmarking either one just clears
   that snapshot and returns the box to the To Bill list, e.g. if it was done by mistake. */
const BOX_RENT_RATE = 125, BOX_RENT_FREE_DAYS = 7, BOX_RENT_DAILY_RATE = BOX_RENT_RATE / 7;
function daysBetweenDates(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function boxRentCalc(c) {
  if (!c.placedAt) return { days: null, weeks: 0, amt: 0, final: false };
  if (c.pickedUpAt) {
    // Stay is over — the amount is whatever was prorated and frozen at pickup, not recomputed against today.
    return { days: daysBetweenDates(c.placedAt, c.pickedUpAt), weeks: null, amt: c.finalRentAmount || 0, final: true };
  }
  // Still on site: billed in arrears, whole completed weeks only (day 14 = $125, day 21 = $250, ...).
  const days = daysSince(c.placedAt);
  const weeks = Math.floor(Math.max(0, days - BOX_RENT_FREE_DAYS) / 7);
  return { days, weeks, amt: weeks * BOX_RENT_RATE, final: false };
}
// Called whenever a box's status changes AWAY from at_customer (cycling it back to the yard, or dispatching
// a new job on it). If that stay hadn't already been billed/waived, freeze a prorated final amount for the
// partial week that was cut short, so pickup mid-cycle doesn't lose the trailing days or wait on a week
// that's never coming. Once billed/waived, the historical snapshot is already the final word — leave it alone.
function freezeBoxRentOnPickup(c, prevStatus) {
  if (prevStatus !== "at_customer" || !c.placedAt || c.rentBilled || c.rentWaived) return;
  const daysOnSite = daysSince(c.placedAt);
  const billableDays = Math.max(0, daysOnSite - BOX_RENT_FREE_DAYS);
  c.pickedUpAt = CURRENT_DATE;
  c.finalRentAmount = Math.round(billableDays * BOX_RENT_DAILY_RATE * 100) / 100;
}
function isBoxRentExempt(c) { const cust = c.customerId ? findCustomer(c.customerId) : null; return !!(cust && cust.businessExempt); }
// null = not eligible for box rent at all: never placed at a customer, or a stay that's still open (no
// pickup yet) but not currently at_customer shouldn't normally happen — either way there's nothing to bill.
function boxRentCategory(c) {
  if (!c.customerId || !c.placedAt) return null;
  const hasBillableStay = c.status === "at_customer" || !!c.pickedUpAt;
  if (!hasBillableStay) return null;
  if (isBoxRentExempt(c)) return "biz";
  if (c.rentWaived) return "waived";
  if (c.rentBilled) return "invoiced";
  return "bill";
}
let boxRentTab = "bill", boxRentQuery = "", boxRentSort = "amount";
function viewBoxRent() {
  const corp = isCorp();
  const scoped = containers.filter(c => (corp || c.yard === currentYard) && boxRentCategory(c) !== null);
  const q = boxRentQuery.trim().toLowerCase();
  const searched = scoped.filter(c => { const cust = findCustomer(c.customerId); return !q || (c.id + " " + (cust ? cust.name : "") + " " + c.location).toLowerCase().includes(q); });
  const groups = { bill: [], invoiced: [], waived: [], biz: [] };
  searched.forEach(c => groups[boxRentCategory(c)].push(c));
  const sortRows = arr => arr.slice().sort((a, b) => {
    if (boxRentSort === "days") return (boxRentCalc(b).days || 0) - (boxRentCalc(a).days || 0);
    if (boxRentSort === "customer") return (findCustomer(a.customerId)?.name || "").localeCompare(findCustomer(b.customerId)?.name || "");
    return boxRentCalc(b).amt - boxRentCalc(a).amt;
  });
  const rows = sortRows(groups[boxRentTab] || []);
  const toBillTotal = groups.bill.reduce((s, c) => s + boxRentCalc(c).amt, 0);
  const invoicedTotal = groups.invoiced.reduce((s, c) => s + (c.rentBilledAmount || 0), 0);

        <div style="grid-column: span 3;"><label>Search</label><input value="${boxRentQuery}" placeholder="Box, customer, or location…" oninput="boxRentQuery=this.value; render();" /></div>

            : calc.final ? (calc.amt > 0 ? `<span class="badge low">Picked up — ${fmtMoney0(calc.amt)} due (prorated)</span>` : `<span class="badge completed">Picked up — within free week</span>`)

          return `<tr><td>${c.id}</td><td>${c.size}</td><td>${cust ? cust.name : "—"}</td><td>${c.location}</td>
            <td><input type="date" value="${c.placedAt || ""}" onchange="setBoxRentPlacedDate('${c.id}', this.value)" style="width:135px;" /></td>
            <td class="num">${calc.days === null ? "—" : calc.days}</td><td>${badge}</td><td class="num">${amountCell}</td><td>${actionCell}</td></tr>`;
        }).join("") || `<tr><td colspan="9" class="empty">No boxes in this category.</td></tr>`}</tbody>
      </table>
      <div class="footnote">Days on site are counted from the Placed date to today (editable above, e.g. if ScrapDragon's last-move date doesn't match the true drop date). Mark billed/Waive record a snapshot of the amount owed right now; Unmark reverses it in case it was done by mistake.</div>
    </div>

function setBoxRentPlacedDate(id, v) {

  // the frozen final amount rather than leave it stale.

}

/* ---------------- Failed-inspection triage: split flagged items across work orders ----------------
   A single inspection can fail several items that don't all belong on the same work order —
   e.g. two quick items the driver/operator can handle themselves, the rest for a mechanic.
   This lets you check off a subset, assign it, create a work order, and repeat for the rest. */
let inspectionTriage = null; // { inspectionId, itemsLeft: [{category,item,note}], selected: Set<index>, createdIds: [] }
function startInspectionTriage(inspectionId, failedItems) {
  inspectionTriage = {
    inspectionId,
    itemsLeft: failedItems.map(f => ({ category: f.category, item: f.item, note: f.note })),
    selected: new Set(failedItems.map((_, i) => i)),
    createdIds: [],
  };
}
function toggleTriageItem(idx) {
  if (!can('assignWorkOrderItems')) return;
  if (!inspectionTriage) return;
  if (inspectionTriage.selected.has(idx)) inspectionTriage.selected.delete(idx); else inspectionTriage.selected.add(idx);
  render();
}
function deriveWOTitleFromItems(items) {
  if (items.length === 1) return `Failed inspection: ${items[0].item}`;
  return `Failed inspection: ${items[0].item} (+${items.length - 1} more)`;
}
function createWorkOrderFromTriage() {
  if (!can('assignWorkOrderItems')) { alert("You don't have access to assign flagged items to work orders."); return; }
  const t = inspectionTriage; if (!t) return;
  const chosen = t.itemsLeft.filter((_, i) => t.selected.has(i));
  if (!chosen.length) { alert("Check at least one item to include on this work order."); return; }
  const insp = inspections.find(i => i.id === t.inspectionId);
  const a = findAsset(insp.assetId);
  const assigneeId = document.getElementById("triage-assignee").value || null;
  const priority = Number(document.getElementById("triage-priority").value);
  const typeCode = a.id.startsWith("E") ? "FP" : "TRAN";
  const woId = `LIS.${MAINT_YARD_CODE[a.yard]}.${typeCode}.${woSeq++}`;
  const wo = {
    id: woId, assetId: a.id, yard: a.yard, title: deriveWOTitleFromItems(chosen), items: chosen,
    priority, status: assigneeId ? "not_started" : "unassigned", assigneeId,
    issuedDate: CURRENT_DATE, statusChangedDate: CURRENT_DATE, fromInspection: insp.id,
  };
  workOrders.push(wo);
  if (assigneeId) notifyAssignment(wo, assigneeId);
  t.createdIds.push(woId);
  t.itemsLeft = t.itemsLeft.filter((_, i) => !t.selected.has(i));
  t.selected = new Set(t.itemsLeft.map((_, i) => i));
  if (!t.itemsLeft.length) inspectionTriage = null;
  render();
}
function finishTriageUnassigned() {
  if (!can('assignWorkOrderItems')) { alert("You don't have access to assign flagged items to work orders."); return; }
  const t = inspectionTriage; if (!t) return;
  if (!t.itemsLeft.length) { inspectionTriage = null; render(); return; }
  const insp = inspections.find(i => i.id === t.inspectionId);
  const a = findAsset(insp.assetId);
  const typeCode = a.id.startsWith("E") ? "FP" : "TRAN";
  const woId = `LIS.${MAINT_YARD_CODE[a.yard]}.${typeCode}.${woSeq++}`;
  const wo = {
    id: woId, assetId: a.id, yard: a.yard, title: deriveWOTitleFromItems(t.itemsLeft), items: t.itemsLeft.slice(),
    priority: t.itemsLeft.length >= 2 ? 5 : 4, status: "unassigned", assigneeId: null,
    issuedDate: CURRENT_DATE, statusChangedDate: CURRENT_DATE, fromInspection: insp.id,
  };
  workOrders.push(wo);
  inspectionTriage = null;
  render();
}
function addPMSchedule() {
  const assetId = document.getElementById("pm-asset").value;
  const a = findAsset(assetId);
  if (!a) { alert("Add an asset first, then schedule PM for it."); return; }
  const name = document.getElementById("pm-name").value.trim();
  if (!name) { alert("Name the service (e.g. \"250-Hour Service\")."); return; }

}

function scoreResults(results) { return results.length ? Math.round((results.filter(r => r.pass).length / results.length) * 1000) / 10 : 100; }

  fails = fails || {};

    const note = fails[g.category + "|" + item];
    return { category: g.category, item, pass: !note, note: note || null };
  }));
}

function reconcileFreight(id) {
  const f = freightTickets.find(f => f.id === id);
  const val = prompt(`Actual freight cost from the carrier for ${f.id} (was a $0.01 placeholder):`, "");
  if (val === null) return;
  const cost = parseFloat(val);
  if (isNaN(cost) || cost <= 0) { alert("Enter a valid dollar amount."); return; }
  f.cost = r2(cost); f.status = "Reconciled";
  capitalizeInboundFreight(f.id);

}

  const lines = boxes.map(b => ({ kind: "freight", id: b.value, amount: parseFloat(b.dataset.amount) }));
  const total = r2(lines.reduce((s, l) => s + l.amount, 0));

function statsFor(list, kind) {
  return list.map(p => {
    const rel = tickets.filter(t => t.partyId === p.id || (!t.partyId && t.party === p.name));
    const count = rel.length; const total = rel.reduce((s, t) => s + t.total, 0);
    const last = rel.reduce((m, t) => t.date > m ? t.date : m, "");
    return { ...p, count, total, last };
  }).sort((a,b) => b.total - a.total);
}

    channel:"MMS", status:"Sent", detail:"", twilioSid: fakeTwilioSid() });

  const party = findPriceParty(kind, partyId);

  if (kind === "vendor") {
    if (!party.phone) { alert(`Add a phone number for ${party.name} before sending — there's nothing on file to text.`); return; }
    const channel = party.smartphone === false ? "SMS" : "MMS";
    priceListSendLog.unshift({ id:"PL-"+(priceListSendSeq++), date: CURRENT_DATE, time: "Just now", kind, partyId, yard, trigger: "Manual — Send now", commodityCount: commodities.length,

    priceListSendLog.unshift({ id:"PL-"+(priceListSendSeq++), date: CURRENT_DATE, time: "Just now", kind, partyId, yard, trigger: "Manual — Send now", commodityCount: commodities.length });

function autoSendOnUpdate(reason, affects) {
  affects = affects || { customers: true, vendors: true };
  const yard = realYardCodes().includes(currentYard) ? currentYard : "SB";
  if (affects.customers) {
    customers.filter(c => c.onPriceList && c.autoSend === "update").forEach(c => {
      priceListSendLog.unshift({ id:"PL-"+(priceListSendSeq++), date: CURRENT_DATE, time: "Just now", kind:"customer", partyId: c.id, yard, trigger: `Automated — ${reason}`, commodityCount: commodities.length });
      c.lastSent = CURRENT_DATE;

  }
  if (affects.vendors) {

      priceListSendLog.unshift({ id:"PL-"+(priceListSendSeq++), date: CURRENT_DATE, time: "Just now", kind:"vendor", partyId: v.id, yard, trigger: `Automated — ${reason}`, commodityCount: commodities.length,

    });
  }
}

function exportMasterPriceListCsv() {

// Distinct from Mill Reconciliation: transfers never touch an outside mill, so there's nothing to

  const totalFreight = r2(yardTransfers.reduce((s, x) => {

  return `

/* ---------------- Mill Reconciliation ----------------
   Sell tickets invoice the customer at time of shipment, at our own outbound scale weight and our
   sale price. Mills settle on their own certified inbound scale weight (and sometimes a grade/
   moisture-adjusted price), which can differ from what we invoiced — the same "Yard Weights vs.
   Consumer Weights" split ReSpark's invoice screen shows. Rather than rewriting the original
   invoice, each week's confirmed numbers are reconciled here and the net variance across every
   reconciled shipment is posted as ONE aggregated journal entry — mirroring how a real weekly
   mill-settlement batch would land in QuickBooks. */
let journalEntries = [];
let jeSeq = 1;

function millReconReadyToPost() { return millReconEligible().filter(t => t.millRecon && !t.millRecon.jeId); }
function reconcileTicket(ticketId) {
  const t = tickets.find(x => x.id === ticketId);
  if (!t) return;
  const cw = parseFloat(document.getElementById(`mr-wt-${ticketId}`).value);
  const cpDisplay = parseFloat(document.getElementById(`mr-price-${ticketId}`).value);

/* ---------------- Exceptions — fraud/data-integrity checks, inspired by ScrapDragon's theft-detection
   report category (Possible Theft By Weight/Markup/Open-Ticket-Time/Multiple-Visits, Excessive
   Gross-to-Tare Ratio, Possible Duplicate Customers). Three checks are honestly computable from what
   this prototype already tracks; the ones that need scale gross/tare, operator price overrides, or
   ticket open/close timestamps are called out as not-yet-buildable at the bottom of the report instead
   of being faked. See Oct 2 2026 ScrapDragon/ReSpark review in project notes. */
function normalizeName(s) { return (s || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim(); }
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}
// Same phone number, or a near-identical name, across two different vendor/customer records —
// the classic way someone splits activity across identities to stay under a review threshold.
function findDuplicateRecords() {
  const pool = [
    ...vendors.map(v => ({ id: v.id, type: "Vendor", name: v.name, phone: v.phone })),
    ...customers.map(c => ({ id: c.id, type: "Customer", name: c.name, phone: c.phone })),
  ];
  const pairs = [];
  for (let i = 0; i < pool.length; i++) {
    for (let j = i + 1; j < pool.length; j++) {
      const a = pool[i], b = pool[j];
      const phoneMatch = !!(a.phone && b.phone && a.phone === b.phone);
      const na = normalizeName(a.name), nb = normalizeName(b.name);
      const dist = na && nb ? levenshtein(na, nb) : 99;
      const nameClose = na && nb && dist > 0 && dist <= 2 && dist / Math.max(na.length, nb.length) < 0.3;
      if (phoneMatch || nameClose) pairs.push({ a, b, reason: phoneMatch ? "Same phone number" : "Very similar name" });
    }
  }
  return pairs;
}
// The same vendor/customer identity (by partyId, falling back to the raw party name for walk-ins)
// shows up at more than one yard on the same calendar date — not physically possible for one truck.
function findSameDayMultiYard() {
  const groups = {};
  tickets.forEach(t => {
    const key = (t.partyId || t.party) + "|" + t.date;
    groups[key] = groups[key] || { party: t.party, partyId: t.partyId, date: t.date, yards: new Set(), tickets: [] };
    groups[key].yards.add(t.yard);
    groups[key].tickets.push(t);
  });
  return Object.values(groups).filter(g => g.yards.size > 1).map(g => ({ ...g, yards: [...g.yards] }));
}
// 3+ buy tickets within any rolling `windowDays`-day window for the same seller identity — grouped by
// phone number when one is on file (not just vendor id), so two near-duplicate records for the same
// real person/company still get caught as one high-frequency seller instead of two unremarkable ones.
function findHighFrequencySellers(windowDays, minCount) {
  const withIdentity = tickets.filter(t => t.type === "buy" && t.partyId).map(t => {
    const v = findVendor(t.partyId);
    return { ...t, identity: (v && v.phone) ? "phone:" + v.phone : "id:" + t.partyId, vendorName: v ? v.name : t.party };
  });
  const byIdentity = {};
  withIdentity.forEach(t => (byIdentity[t.identity] = byIdentity[t.identity] || []).push(t));
  const flagged = [];
  Object.entries(byIdentity).forEach(([identity, list]) => {
    list.sort((a, b) => a.date.localeCompare(b.date));
    for (let i = 0; i < list.length; i++) {
      const windowTickets = list.filter(t => Math.abs(daysBetweenDates(list[i].date, t.date)) <= windowDays);
      if (windowTickets.length >= minCount) {
        flagged.push({

function gpBuildRow(t) {

  const freightPend = freightForTicket(t.id).some(f => f.status === "Estimated");

  const adjustments = r2(list.reduce((s, r) => s + r.adjustments, 0));
  const freight = r2(list.reduce((s, r) => s + r.freight, 0));
  const gp = r2(list.reduce((s, r) => s + r.gp, 0));
  const gt = netWeight / 2240;

function numberToWords(num) {
  const ones = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function chunk(n) {
    let s = "";
    if (n >= 100) { s += ones[Math.floor(n / 100)] + " Hundred "; n %= 100; }
    if (n >= 20) { s += tens[Math.floor(n / 10)] + " "; n %= 10; if (n) s += ones[n] + " "; }
    else if (n > 0) { s += ones[n] + " "; }
    return s.trim();
  }
  if (num === 0) return "Zero";
  const groups = ["", " Thousand", " Million"];
  let n = Math.floor(num), i = 0, parts = [];
  while (n > 0) {
    const rem = n % 1000;
    if (rem) parts.unshift(chunk(rem) + groups[i]);
    n = Math.floor(n / 1000);
    i++;
  }
  return parts.join(" ").trim();
}
function amountInWords(amount) {
  const dollars = Math.floor(amount + 1e-6);
  const cents = Math.round((amount - dollars) * 100);
  return `${numberToWords(dollars)} and ${String(cents).padStart(2, "0")}/100 Dollars`;
}

function voidRemittance(remittanceId) {

function updateContractQtyLabels() {
  const code = document.getElementById("ct-commodity").value;
  const u = qtyUnitLabel(code);
  const cl = document.getElementById("ct-committed-label"); if (cl) cl.textContent = `Committed quantity (${u})`;
  const sl = document.getElementById("ct-shipped-label"); if (sl) sl.textContent = `Already shipped (${u})`;
}
function addContract() {
  const customerId = document.getElementById("ct-customer").value;
  const commodity = document.getElementById("ct-commodity").value;
  const yard = document.getElementById("ct-yard").value;
  const endDate = document.getElementById("ct-enddate").value;
  const committedQty = parseFloat(document.getElementById("ct-committed").value) || 0;
  const shippedQty = parseFloat(document.getElementById("ct-shipped").value) || 0;
  const notes = document.getElementById("ct-notes").value.trim();
  const numberInput = document.getElementById("ct-number").value.trim();
  const terms = document.getElementById("ct-terms").value || null;
  if (!customerId) { alert("Pick a customer."); return; }
  if (committedQty <= 0) { alert("Enter a committed quantity greater than zero."); return; }
  if (!endDate) { alert("Enter a ship-by date."); return; }
  const id = numberInput || ("CT-" + contractSeq);
  if (contracts.some(c => c.id.toLowerCase() === id.toLowerCase())) {
    alert(`Contract # "${id}" is already in use — enter a different number.`);
    return;
  }
  contractSeq++;
  contracts.push({ id, customerId, commodity, yard, committedQty, shippedQty, endDate, notes, terms });
  render();
}
function promptRenameContract(id) {
  const c = findContract(id);
  if (!c) return;
  const input = prompt("Enter this contract's number (e.g. your own PO or contract number):", c.id);
  if (input === null) return;
  renameContract(id, input);
}
function renameContract(oldId, newId) {
  const c = findContract(oldId);
  if (!c) return;
  const trimmed = (newId || "").trim();
  if (!trimmed) { alert("Contract # can't be blank."); return; }
  if (trimmed !== oldId && contracts.some(x => x.id.toLowerCase() === trimmed.toLowerCase())) {
    alert(`Contract # "${trimmed}" is already in use by another contract.`);
    return;
  }
  c.id = trimmed;
  tickets.forEach(t => { if (t.contractId === oldId) t.contractId = trimmed; });
  render();
}
function logContractShipment(id) {
  const c = findContract(id);
  if (!c) return;
  const remaining = Math.max(0, c.committedQty - c.shippedQty);
  const input = prompt(`Log how much was just shipped against ${id}, in ${qtyUnitLabel(c.commodity)} (${fmtQty(c.commodity, remaining)} remaining):`, "0");
  if (input === null) return;
  const qty = parseFloat(input) || 0;
  if (qty <= 0) return;
  c.shippedQty = Math.min(c.committedQty, c.shippedQty + qty);
  render();
}

function reassignUserRole(userId, roleId) {

function addUser() {
  if (!can('manageUsers')) return;

function removeUser(userId) {
  if (!can('manageUsers')) return;
  if (userId === currentUserId) { alert("You can't remove the user you're currently viewing as — switch to someone else first."); return; }

function openUserAccessEditor(userId) {
  const el = document.getElementById("user-access-editor");
  const u = findUser(userId);
  const role = findRole(u.roleId);
  el.innerHTML = `
    <div class="weightpad">
      <h2 style="font-size:13px; margin:0 0 10px;">${u.name} — individual access (role: ${role ? role.name : "—"})</h2>
      <table>
        <thead><tr><th>Permission</th><th>Role default</th><th>This user</th></tr></thead>
        <tbody>
          ${PERMISSIONS.map(p => {
            const roleDefault = role ? role.permissions.includes(p.key) : false;
            const effective = hasPermission(u.id, p.key);
            const overridden = effective !== roleDefault;
            return `<tr>
              <td>${p.label}<div class="footnote" style="margin:2px 0 0;">${p.desc}</div></td>
              <td>${roleDefault ? "Granted" : "—"}</td>
              <td><label style="font-weight:400; display:flex; align-items:center; gap:6px;"><input type="checkbox" style="width:auto;" ${effective?"checked":""} onchange="toggleUserPermission('${u.id}','${p.key}')" /> ${effective ? "Granted" : "Not granted"} ${overridden ? `<span class="badge" style="background:rgba(242,169,0,.15); color:#a35a00;">custom</span>` : ""}</label></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      <div style="margin-top:12px; display:flex; gap:10px;">
        <button class="btn secondary" onclick="removeUser('${u.id}')">Remove user</button>
        <button class="btn ghost" onclick="document.getElementById('user-access-editor').innerHTML='';">Close</button>
      </div>
    </div>`;
}
function toggleUserPermission(userId, key) {
  if (!can('manageUsers')) { alert("You don't have access to manage users."); return; }
  const u = findUser(userId);
  const role = findRole(u.roleId);
  const roleDefault = role ? role.permissions.includes(key) : false;
  const wantHas = !hasPermission(userId, key);
  u.grants = u.grants.filter(k => k !== key);
  u.revokes = u.revokes.filter(k => k !== key);
  if (wantHas !== roleDefault) { (wantHas ? u.grants : u.revokes).push(key); }
  render();
  openUserAccessEditor(userId);
}

function addKioskButton() {

function deleteKioskButton(id) {

  const b = findKioskButton(id);
  if (b.type === "folder" && kioskChildren(id).length && !confirm(`"${b.label}" contains buttons — delete it and everything inside?`)) return;
  const idsToRemove = new Set([id, ...kioskChildren(id).map(c=>c.id)]);
  kioskButtons = kioskButtons.filter(x => !idsToRemove.has(x.id));
  if (kioskFolderPath.includes(id)) kioskFolderPath = [];
  render();
}

  document.getElementById("mynotifcount").textContent = unreadNotifCount();
  const panel = document.getElementById("notifpanel");
  if (!notifPanelOpen) { panel.innerHTML = ""; return; }
  panel.innerHTML = `
    <div class="notif-panel">
      <div class="np-head"><span>Notifications — ${u ? u.name : "—"}</span>${mine.some(n=>!n.read) ? `<span class="link" onclick="markAllNotifsRead()">Mark all read</span>` : ""}</div>
      ${mine.length ? mine.map(n => `
        <div class="notif-item ${n.read ? "" : "unread"}" onclick="openNotification('${n.id}')">
          <div class="np-msg">${n.message}</div>
          <div class="np-meta">${n.createdAt}${n.read ? "" : " · unread"}</div>
        </div>`).join("") : `<div class="notif-empty">No notifications for you yet.</div>`}
    </div>`;
}
function render() {
  renderNav();
  renderYardPicker();
  document.getElementById("pagetitle").textContent = pageTitles[currentRoute];
  document.getElementById("alertcount").textContent = computeAlerts().length;
  renderNotifBell();
  const main = document.getElementById("main");
  const viewMap = {
    dashboard: viewDashboard, kiosk: viewKiosk, purchasing: viewCashier, sales: viewSales,
    dispatch: viewFreight /* Dispatch folded into Freight (Board/Containers tabs) — alias kept so any
      direct link to the old standalone route still resolves instead of crashing */,
    inventory: viewInventory, freight: viewFreight, maintenance: viewMaintenance,
    customers: viewCustomers, vendors: viewVendors, commodities: viewCommodities, pricelists: viewPriceLists, accounting: viewQuickBooks,
    kbi: viewKbi, reports: viewReports, documents: viewDocuments, settings: viewSettings,
  };
  main.innerHTML = viewMap[currentRoute]();
  if (!isCorp() && currentRoute === "sales" && salesTab === "tickets") { updateTicketPrice("sell"); }
  if (!isCorp() && currentRoute === "kiosk" && kioskTab === "buy") { renderKioskButtons(); renderKioskEntry(); }
  if (!isCorp() && currentRoute === "inventory" && inventoryTab === "moves") { mvUpdateAvailability(); }
}

// App no longer auto-renders on load — it waits behind the real login screen (#loginScreen).
// doLogin() calls render() itself once authentication + bootstrapFromApi() succeed.
</script>
<div id="print-area"></div>
</body>
</html>
